<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PrintOps Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <span class="reg" aria-hidden="true"></span>
        <div>
          <strong id="brand-name">PrintOps</strong>
          <small>Jobs · Invoices · Payments</small>
        </div>
      </div>
      <nav class="nav" aria-label="Main">
        <a href="#dashboard" data-route="dashboard">Dashboard</a>
        <a href="#jobs" data-route="jobs">Jobs</a>
        <a href="#invoices" data-route="invoices">Invoices</a>
        <a href="#payments" data-route="payments">Payments</a>
        <a href="#customers" data-route="customers">Customers</a>
        <a href="#reports" data-route="reports">Reports</a>
        <a href="#settings" data-route="settings">Settings</a>
      </nav>
      <div class="cmyk" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </aside>

    <main class="main">
      <div id="banner" class="banner" hidden></div>
      <div id="view"></div>
    </main>
  </div>

  <dialog id="modal" class="modal">
    <form id="modal-form" method="dialog" novalidate>
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
      </header>
      <div id="modal-body" class="modal-body"></div>
      <footer id="modal-foot" class="modal-foot"></footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="print-root" class="print-root"></div>

  <script src="js/vendor/qrcode.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
