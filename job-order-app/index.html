<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a5fb4">
<title>Job Order Sender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column, tab bar fixed to the bottom on phones and
   moved to the top on wide screens. Ticket-like order cards borrow the look of a
   printed job bag; WhatsApp green is used only on the send button. */
:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --ink: #15181d;
  --ink-2: #4a515e;
  --ink-3: #7d8594;
  --line: #dde2e9;
  --line-2: #edf0f4;
  --accent: #0a5fb4;
  --accent-soft: #e2edf9;
  --wa: #1a8f4c;
  --wa-ink: #ffffff;
  --good: #1d7a46; --good-soft: #e1f2e8;
  --warn: #946100; --warn-soft: #fcf0d4;
  --bad: #b3261e; --bad-soft: #fbe3e1;
  --info: #0a5fb4; --info-soft: #e2edf9;
  --shadow: 0 1px 2px rgb(21 24 29 / .06), 0 6px 20px rgb(21 24 29 / .08);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
  --tabbar: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --card: #191c22; --ink: #e9ecf1; --ink-2: #b5bcc8; --ink-3: #868e9d;
    --line: #2c313b; --line-2: #22262e; --accent: #6aaef0; --accent-soft: #1b2b40;
    --wa: #2fb866; --wa-ink: #0b1a10;
    --good: #5cc98a; --good-soft: #17301f; --warn: #e8b547; --warn-soft: #33290f;
    --bad: #f07a70; --bad-soft: #3a1c1a; --info: #6aaef0; --info-soft: #1b2b40;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 20px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --card: #191c22; --ink: #e9ecf1; --ink-2: #b5bcc8; --ink-3: #868e9d;
  --line: #2c313b; --line-2: #22262e; --accent: #6aaef0; --accent-soft: #1b2b40;
  --wa: #2fb866; --wa-ink: #0b1a10;
  --good: #5cc98a; --good-soft: #17301f; --warn: #e8b547; --warn-soft: #33290f;
  --bad: #f07a70; --bad-soft: #3a1c1a; --info: #6aaef0; --info-soft: #1b2b40;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 20px rgb(0 0 0 / .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 1.45rem; font-weight: 800; }
h2 { font-size: 1.1rem; font-weight: 700; }
h3 { font-size: .95rem; font-weight: 700; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { text-align: right; white-space: nowrap; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }

.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 16px calc(var(--tabbar) + 32px + env(safe-area-inset-bottom, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.top p { margin: 2px 0 0; color: var(--ink-3); font-size: 13px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mark { width: 30px; height: 30px; flex: none; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--card); font: 800 14px var(--f-display); }
.brand b { font-family: var(--f-display); font-size: 1rem; display: block; line-height: 1.2; overflow-wrap: anywhere; }
.brand small { color: var(--ink-3); font-size: 12px; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: var(--r); padding: 10px 12px; font-size: 13px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { background: none; border: 0; height: var(--tabbar); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 500 11.5px var(--f-body); color: var(--ink-3); cursor: pointer; }
.tabs svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button.on { color: var(--accent); font-weight: 600; }
@media (min-width: 900px) {
  .tabs { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); padding-bottom: 0; grid-template-columns: repeat(5, auto); justify-content: center; gap: 4px; }
  .tabs button { flex-direction: row; height: 52px; padding-inline: 16px; font-size: 14px; gap: 8px; }
  .tabs svg { width: 18px; height: 18px; }
  .wrap { padding-block: 22px 48px; }
}

/* controls */
.btn { font: 600 14px/1 var(--f-body); border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 12px 16px; border-radius: var(--r); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; min-height: 44px; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn.wa { background: var(--wa); border-color: var(--wa); color: var(--wa-ink); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
.btn.sm { min-height: 36px; padding: 8px 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row > .btn { flex: 1 1 140px; }

label.f { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
label.f > span { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
input, select, textarea { font: 16px var(--f-body); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; min-height: 44px; }
input[type="number"], input[inputmode="decimal"] { font-family: var(--f-mono); }
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.invalid { border-color: var(--bad) !important; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 500; min-height: 44px; }
.check input { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.full { grid-column: 1 / -1; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.section { display: flex; flex-direction: column; gap: 14px; }
.section + .section { margin-top: 14px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* order lines */
.line { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--card); }
.line-head { display: flex; align-items: center; gap: 8px; }
.line-head .n { font: 600 12px var(--f-mono); color: var(--ink-3); width: 22px; flex: none; }
.line-head input { flex: 1; font-weight: 600; }
.line .amt { font: 600 15px var(--f-mono); text-align: right; }
.icon-btn { background: none; border: 0; width: 40px; height: 40px; flex: none; border-radius: 8px; color: var(--ink-3); font-size: 22px; cursor: pointer; }
.icon-btn:hover { background: var(--line-2); color: var(--bad); }
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }

.totals { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 14px; }
.totals .num { font-size: 15px; }
.totals .grand { font-weight: 700; font-size: 16px; border-top: 1px solid var(--line); padding-top: 8px; }
.totals .bal { color: var(--accent); }

/* lists */
.list { display: flex; flex-direction: column; gap: 10px; }
.row { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.row:hover { border-color: var(--ink-3); }
.row .t { font-weight: 600; overflow-wrap: anywhere; }
.row .s { color: var(--ink-3); font-size: 13px; overflow-wrap: anywhere; }
.row .r { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.search { margin-bottom: 12px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 999px; padding: 7px 12px; font: 500 13px var(--f-body); cursor: pointer; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--card); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill { background: var(--line-2); color: var(--ink-2); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.done { background: var(--line-2); color: var(--ink-2); }
.pills { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.spec { font-style: italic; }
.due-sum { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
.due-sum b { font: 600 17px var(--f-mono); }
.due-sum b.has { color: var(--bad); }
.pay-list { display: flex; flex-direction: column; gap: 6px; }
.pay-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: var(--card); border: 0; border-right: 1px solid var(--line); min-height: 44px; font: 500 14px var(--f-body); color: var(--ink-2); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--card); }
.st-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; }
.st-row .icon-btn { width: 36px; height: 36px; font-size: 16px; }
.icon-btn:disabled { opacity: .3; cursor: not-allowed; }
.meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); }
.meter.hot span { background: var(--bad); }
.sync-ind { font-size: 12px; color: var(--ink-3); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; padding: 6px 0; font-family: var(--f-body); }
.sync-ind::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.sync-ind.err::before { background: var(--bad); }
.sync-ind.busy::before { background: var(--warn); }
.empty { text-align: center; color: var(--ink-3); padding: 28px 12px; border: 1px dashed var(--line); border-radius: 12px; }

/* dialog */
dialog { border: 0; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); border-radius: 16px; background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgb(10 12 16 / .5); }
.dlg { display: flex; flex-direction: column; max-height: calc(100dvh - 24px); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line-2); }
.dlg-body { padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.dlg-body > * { flex-shrink: 0; }
.dlg-foot { padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line-2); display: flex; flex-wrap: wrap; gap: 8px; }
.dlg-foot > .btn { flex: 1 1 120px; }
.close { background: none; border: 0; font-size: 26px; line-height: 1; color: var(--ink-3); cursor: pointer; width: 40px; height: 40px; border-radius: 8px; }

/* job ticket preview */
.ticket { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.ticket-top { padding: 12px 14px; background: var(--line-2); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ticket-top b { font-family: var(--f-mono); }
.ticket table { width: 100%; border-collapse: collapse; font-size: 14px; }
.ticket td { padding: 8px 14px; border-top: 1px solid var(--line-2); vertical-align: top; }
.ticket td small { display: block; color: var(--ink-3); }
.ticket .totals { padding: 10px 14px 14px; border-top: 1px solid var(--line); }
.msg { font: 13.5px/1.5 var(--f-mono); min-height: 300px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); z-index: 60; max-width: calc(100vw - 32px); font-size: 14px; }
@media (min-width: 900px) { .toast { bottom: 24px; } }
@media (max-width: 420px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid3 .amt-cell { grid-column: 1 / -1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<nav class="tabs" aria-label="Sections">
  <button data-tab="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New order</button>
  <button data-tab="orders"><svg viewBox="0 0 24 24"><path d="M7 3h10l2 3v15H5V6z"/><path d="M9 10h6M9 14h6M9 18h3"/></svg>Orders</button>
  <button data-tab="customers"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>Customers</button>
  <button data-tab="items"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>Items</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>

<main class="wrap">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">JO</span><div><b id="brand-name">Job Orders</b><small>Create · Save · Send on WhatsApp</small></div></div>
    <button type="button" id="sync-ind" class="sync-ind" data-act="sync-now" hidden></button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="view"></div>
</main>

<dialog id="dlg"><div class="dlg">
  <div class="dlg-head"><h2 id="dlg-title"></h2><button type="button" class="close" data-close aria-label="Close">×</button></div>
  <div class="dlg-body" id="dlg-body"></div>
  <div class="dlg-foot" id="dlg-foot"></div>
</div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="restore-file" accept=".json,application/json,text/plain" hidden>

<script>
(function () {
  "use strict";
  const KEY = "joborders.v1";            // shared data (orders, customers, items, shared settings)
  const DKEY = KEY + ".device";           // this device only (series, theme, sync link)
  // Inside the Android app (Capacitor) a few things use native plugins instead of browser APIs.
  const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const Plug = NATIVE ? window.Capacitor.Plugins || {} : {};
  const DEFAULT_STATUSES = ["New", "Design", "Waiting approval", "Approved", "Printing", "Finishing", "Ready", "Delivered", "On hold", "Cancelled"];
  const LOCKED = ["Delivered", "Cancelled"];   // closed statuses keep their meaning, so they cannot be renamed
  const STATUS_TONE = { New: "info", Design: "info", "Waiting approval": "warn", Approved: "info", Printing: "warn", Finishing: "warn", Ready: "good", Delivered: "done", "On hold": "bad", Cancelled: "bad" };
  const METHODS = ["Cash", "Bank transfer", "Card / mada", "Other"];
  const UNITS = ["pcs", "box", "set", "pack", "sheet", "book", "sqm", "m", "roll", "job"];
  const TYPES = ["customers", "items", "orders"];
  const SHARED = ["companyName", "phone", "footer", "vatDefault", "vatRate", "dueDays", "statuses"];
  const QUOTA = 5000000; // localStorage holds about 5 million characters
  const WA_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>';

  /* ---------- helpers ---------- */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const nowIso = () => new Date().toISOString();
  function today() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function addDays(iso, n) { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  /** 2026-10-01 -> 01-Oct-26 */
  function fmtDate(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}-${MON[Number(m) - 1]}-${y.slice(2)}`; }
  function fmtTime(iso) { const d = new Date(iso); return isNaN(d) ? "" : `${fmtDate(new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10))} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
  // money is kept in halalas (integer 1/100 SAR) for every calculation
  const hal = (v) => { const n = Number(v); return Number.isFinite(n) ? Math.sign(n) * Math.round(Math.abs(n) * 100) : 0; };
  const lineHal = (qty, price) => { const v = (Number(qty) || 0) * (Number(price) || 0); return Math.sign(v) * Math.round(Math.abs(v) * 100); };
  const fmt = (h) => (h / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const sar = (h) => `SAR ${fmt(h)}`;
  const qtyFmt = (q) => Number(q || 0).toLocaleString("en-US", { maximumFractionDigits: 3 });
  function waPhone(phone) {
    let d = String(phone || "").replace(/\D/g, "");
    if (d.startsWith("00")) d = d.slice(2);
    if (d.length === 10 && d.startsWith("05")) d = "966" + d.slice(1);
    else if (d.length === 9 && d.startsWith("5")) d = "966" + d;
    return d.length >= 8 ? d : "";
  }
  function totals(o) {
    const sub = (o.lines || []).reduce((s, l) => s + lineHal(l.qty, l.price), 0);
    const rate = o.vat ? Number(o.vatRate || 15) : 0;
    const vat = Math.round((sub * rate) / 100);
    const total = sub + vat;
    const paid = (o.payments || []).reduce((s, p) => s + hal(p.amount), 0);
    return { sub, rate, vat, total, paid, bal: total - paid };
  }
  function payState(o) {
    const t = totals(o);
    if (t.total > 0 && t.bal <= 0) return { label: "Paid", tone: "good" };
    if (t.paid > 0) return { label: "Partly paid", tone: "warn" };
    return { label: "Due", tone: "bad" };
  }
  const isClosed = (o) => o.status === "Delivered" || o.status === "Cancelled";
  const tone = (s) => STATUS_TONE[s] || "";

  /* ---------- state ---------- */
  const DEFAULT_SETTINGS = { companyName: "", phone: "", footer: "Thank you for your order.", vatDefault: true, vatRate: 15, dueDays: "", statuses: DEFAULT_STATUSES.slice() };
  let storageOk = true;

  const retouched = new Set(); // records changed while a sync request is in flight
  function blank() { return { v: 2, settings: { ...DEFAULT_SETTINGS, statuses: DEFAULT_STATUSES.slice(), updatedAt: nowIso() }, customers: [], items: [], orders: [], demo: false }; }
  function sample() {

      return { id: uid(), no: `JO-${String(n).padStart(4, "0")}`, date: addDays(t, d), dueDate: due === null ? "" : addDays(t, d + due), customerId: c.id, customer: { name: c.name, phone: c.phone, company: c.company }, lines, vat: true, vatRate: 15, notes, status, createdAt: addDays(t, d), updatedAt: at,
        payments: pays.map(([amt, m, off]) => ({ id: uid(), date: addDays(t, d + off), amount: amt, method: m, note: "" })) };
    };
    const L = (i, qty, price, note = "") => { const x = s.items[i]; return { name: x.name, spec: x.spec, unit: x.unit, qty, price: price ?? x.price, note }; };
    s.orders = [

      mk(2, [L(2, 2), L(5, 12)], "Printing", -1, [[500, "Cash", 0]], "Deliver to Obhur venue."),
      mk(0, [L(1, 500)], "Waiting approval", 0, [], "Send proof before printing.", null),
    ];
    return s;
  }
  /** Bring older saved data up to the current shape. */
  function migrate(s) {
    s.settings = { ...DEFAULT_SETTINGS, ...s.settings };
    if (!Array.isArray(s.settings.statuses) || !s.settings.statuses.length) s.settings.statuses = DEFAULT_STATUSES.slice();
    LOCKED.forEach((x) => { if (!s.settings.statuses.includes(x)) s.settings.statuses.push(x); });
    if (!s.settings.updatedAt) s.settings.updatedAt = nowIso();
    ["customers", "items", "orders"].forEach((t) => { s[t] = (s[t] || []).map((r) => (r.updatedAt ? r : { ...r, updatedAt: nowIso() })); });
    if (!s.v || s.v < 2) {
      s.orders.forEach((o) => {
        if (!Array.isArray(o.payments)) o.payments = [];
        if (o.advance && hal(o.advance) > 0) o.payments.push({ id: uid(), date: o.date, amount: hal(o.advance) / 100, method: "Cash", note: "Advance" });
        delete o.advance;
        if (o.status === "In progress") o.status = "Printing";
        if (!s.settings.statuses.includes(o.status)) s.settings.statuses.splice(s.settings.statuses.length - 2, 0, o.status);
      });
      s.v = 2;
    }
    s.orders.forEach((o) => { if (!Array.isArray(o.payments)) o.payments = []; });
    return s;
  }
  function loadState() {
    try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); return migrate({ ...blank(), ...o, v: o.v || 1 }); } }
    catch (e) { storageOk = false; }
    return sample();
  }
  function loadDevice(st) {
    let d = {};
    try { d = JSON.parse(localStorage.getItem(DKEY)) || {}; } catch (e) {}
    if (!d.id) d.id = uid();
    if (!d.series) d.series = "JO";
    if (!d.next) d.next = (st.seq || 0) + 1;
    if (!d.theme) d.theme = "auto";
    if (!d.sync) d.sync = { url: "", pin: "", since: 0, lastAt: "", lastMsg: "", error: "" };
    if (!Array.isArray(d.dirty)) d.dirty = [];
    return d;
  }
  let state = loadState();
  let device = loadDevice(state);
  delete state.seq;
  const dirty = new Set(device.dirty);

  function persist() {
    device.dirty = [...dirty];
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      localStorage.setItem(DKEY, JSON.stringify(device));

    } catch (e) { storageOk = false; }
    banner();
  }
  function save() { persist(); scheduleSync(); }
  /** Stamp a record as changed so it is sent on the next sync. */
  function touch(type, rec) {
    rec.updatedAt = nowIso();
    const k = `${type}:${type === "settings" ? "shared" : rec.id}`;
    dirty.add(k);
    if (syncing) retouched.add(k);
  }
  persist();
  const live = (arr) => arr.filter((x) => !x.deleted);
  const byId = (arr, id) => arr.find((x) => x.id === id && !x.deleted);

  /** Next order number for this device's series, never reusing one already saved. */
  function nextNumber() {
    const pre = device.series + "-";
    let max = 0;
    state.orders.forEach((o) => { if (o.no && o.no.startsWith(pre)) { const n = parseInt(o.no.slice(pre.length), 10); if (n > max) max = n; } });
    const n = Math.max(device.next || 1, max + 1);
    device.next = n + 1;
    return `${pre}${String(n).padStart(4, "0")}`;
  }
  function previewNumber() {
    const pre = device.series + "-";
    let max = 0;
    state.orders.forEach((o) => { if (o.no && o.no.startsWith(pre)) { const n = parseInt(o.no.slice(pre.length), 10); if (n > max) max = n; } });
    return `${pre}${String(Math.max(device.next || 1, max + 1)).padStart(4, "0")}`;
  }

  /* ---------- theme ---------- */
  function applyTheme() {
    const r = document.documentElement;
    if (device.theme === "light" || device.theme === "dark") r.setAttribute("data-theme", device.theme);
    else r.removeAttribute("data-theme");
  }
  applyTheme();

  /* ---------- toast, dialog, confirm ---------- */
  let tt;
  function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2800); }
  const dlg = $("#dlg");
  let dlgCtx = null; // what the open dialog shows, so sync can refresh it
  function openDlg(title, body, foot, after) {
    $("#dlg-title").textContent = title;
    const b = $("#dlg-body"); b.oninput = b.onclick = b.onchange = null; b.innerHTML = body;
    $("#dlg-foot").innerHTML = foot || "";

  }
  function closeDlg() { if (dlg.open) dlg.close(); dlgCtx = null; }
  dlg.addEventListener("close", () => { dlgCtx = null; });
  dlg.addEventListener("click", (e) => { if (e.target.closest("[data-close]") || e.target === dlg) closeDlg(); });
  let confirmYes = null;
  function confirmBox(title, text, label, yes) {

    dlgCtx = null;
    openDlg(title, `<p style="margin:0">${text}</p>`, `<button class="btn" data-close>Cancel</button><button class="btn primary" data-act="confirm-yes">${esc(label)}</button>`);
  }

  function banner() {
    const b = $("#banner");
    if (!storageOk) { b.hidden = false; b.innerHTML = "This device is out of storage space or blocking storage, so new records may not be saved. Share a backup file from Settings now."; }
    else if (state.demo) { b.hidden = false; b.innerHTML = `<span>You are looking at <b>sample data</b>. Add your company name in Settings, then clear the samples.</span><button class="btn sm" data-tab="settings">Settings</button>`; }
    else b.hidden = true;
    $("#brand-name").textContent = state.settings.companyName || "Job Orders";
    const si = $("#sync-ind"), sy = device.sync;
    si.hidden = !sy.url;
    if (sy.url) {
      si.className = "sync-ind" + (syncing ? " busy" : sy.error ? " err" : "");
      si.textContent = syncing ? "Syncing…" : sy.error ? "Not synced" : sy.lastAt ? `Synced ${fmtTime(sy.lastAt).slice(-5)}` : "Sync";
      si.title = sy.error || "Tap to sync now";
    }
  }

  /* ---------- tabs ---------- */
  let tab = "new";
  try { tab = localStorage.getItem(KEY + ".tab") || "new"; } catch (e) {}
  const filters = { status: "Open", q: "", cq: "", iq: "" };
  function go(t) {
    if (t !== tab) stEdit = null;
    tab = t;
    try { localStorage.setItem(KEY + ".tab", t); } catch (e) {}
    $$(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
    render();
    window.scrollTo(0, 0);
  }
  function render() { banner(); $("#view").innerHTML = views[tab](); if (tab === "new") bindEditor(); }

  /* ---------- order editor ---------- */
  let draft = null;
  function newDraft(preset = {}) {
    const dd = state.settings.dueDays;
    return { id: null, customerId: "", lines: [], vat: !!state.settings.vatDefault, vatRate: state.settings.vatRate || 15, paidNow: "", payMethod: "Cash", notes: "", date: today(), dueDate: dd === "" || dd === null || dd === undefined ? "" : addDays(today(), Number(dd) || 0), ...preset };
  }
  try { draft = JSON.parse(localStorage.getItem(KEY + ".draft")) || null; } catch (e) {}
  if (!draft) draft = newDraft();
  if (draft.advance !== undefined) { draft.paidNow = draft.advance; delete draft.advance; }
  function keepDraft() { try { localStorage.setItem(KEY + ".draft", JSON.stringify(draft)); } catch (e) {} }

  function lineCard(l, i) {
    return `<div class="line" data-i="${i}">
      <div class="line-head"><span class="n">${i + 1}.</span><input data-k="name" value="${esc(l.name)}" placeholder="Item name" aria-label="Item ${i + 1} name"><button type="button" class="icon-btn" data-act="rm-line" data-i="${i}" aria-label="Remove item ${i + 1}">×</button></div>
      <input data-k="spec" class="spec" value="${esc(l.spec)}" placeholder="Details: size, paper, colours, finishing" aria-label="Item ${i + 1} details">
      <div class="grid3">
        <label class="f"><span>Qty</span><input data-k="qty" type="number" inputmode="decimal" min="0" step="any" value="${esc(l.qty)}"></label>
        <label class="f"><span>Unit</span><select data-k="unit">${UNITS.concat(UNITS.includes(l.unit) || !l.unit ? [] : [l.unit]).map((u) => `<option ${u === l.unit ? "selected" : ""}>${u}</option>`).join("")}</select></label>
        <label class="f"><span>Price, SAR</span><input data-k="price" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(l.price)}"></label>
        <div class="amt-cell full"><div class="amt" data-amt="${i}">${sar(lineHal(l.qty, l.price))}</div></div>
      </div>
      <input data-k="note" value="${esc(l.note)}" placeholder="Note for this item (optional)" aria-label="Item ${i + 1} note">
    </div>`;
  }
  function totalsHtml(o, extraPaid = 0) {
    const t = totals(o);
    const paid = t.paid + extraPaid, bal = t.total - paid;
    return `<span>Subtotal</span><span class="num">${fmt(t.sub)}</span>
      ${o.vat ? `<span>VAT ${t.rate}%</span><span class="num">${fmt(t.vat)}</span>` : ""}
      <span class="grand">Total</span><span class="num grand">${sar(t.total)}</span>
      ${paid ? `<span>Paid</span><span class="num">−${fmt(paid)}</span><span class="grand bal">${bal <= 0 ? "Fully paid" : "Balance due"}</span><span class="num grand bal">${sar(Math.max(bal, 0))}</span>` : ""}`;
  }

  const views = {};
  views.new = () => {
    const d = draft;
    const editing = d.id && byId(state.orders, d.id);

    const itemOpts = live(state.items).sort((a, b) => a.name.localeCompare(b.name))
      .map((it) => `<option value="${it.id}">${esc(it.name)} · ${fmt(hal(it.price))}/${esc(it.unit)}</option>`).join("");
    const extra = editing ? 0 : hal(d.paidNow);
    return `
      <div class="top" style="margin-top:-4px"><div><h1>${editing ? `Edit ${esc(editing.no)}` : "New job order"}</h1><p>${editing ? "Change the order and save it again." : `Next number on this device: <span class="mono">${esc(previewNumber())}</span>`}</p></div>
        ${d.lines.length || d.customerId ? `<button class="btn ghost sm" data-act="clear-draft">${editing ? "Cancel" : "Clear"}</button>` : ""}</div>
      <section class="card section">

        <div id="d-cust-info" class="small muted"></div>
      </section>
      <section class="card section">
        <div class="sec-head"><h2>Items</h2><button class="btn ghost sm" data-act="add-custom">+ Custom item</button></div>
        <div class="add-row"><select id="d-additem" aria-label="Add a saved item"><option value="">Add a saved item…</option>${itemOpts}</select><button class="btn primary" data-act="add-item">Add</button></div>
        <div id="d-lines" class="stack">${d.lines.length ? d.lines.map(lineCard).join("") : `<div class="empty">No items yet. Choose a saved item above or add a custom one.</div>`}</div>
      </section>
      <section class="card section">
        <h2>Order details</h2>
        <div class="grid2">
          <label class="f"><span>Order date</span><input id="d-date" type="date" value="${esc(d.date)}"></label>
          <label class="f"><span>Delivery date (optional)</span><input id="d-due" type="date" value="${esc(d.dueDate)}"></label>
          ${editing ? `<p class="small muted full" style="margin:0">Payments for this order are recorded from the order screen (Orders → tap the order).</p>` : `
          <label class="f"><span>Paid now, SAR (optional)</span><input id="d-paid" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(d.paidNow)}" placeholder="0.00"></label>
          <label class="f"><span>Paid by</span><select id="d-method">${METHODS.map((m) => `<option ${m === d.payMethod ? "selected" : ""}>${m}</option>`).join("")}</select></label>`}
          <label class="check full"><input id="d-vat" type="checkbox" ${d.vat ? "checked" : ""}> Add VAT ${esc(d.vatRate)}%</label>
          <label class="f full"><span>Notes</span><textarea id="d-notes" placeholder="Artwork, delivery address, special instructions">${esc(d.notes)}</textarea></label>
        </div>
        <div class="totals" id="d-totals">${totalsHtml(d, extra)}</div>
      </section>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn" data-act="save-order">${editing ? "Save changes" : "Save order"}</button>
        <button class="btn wa" data-act="save-share">${WA_ICON} Save &amp; send on WhatsApp</button>
      </div>`;
  };
  function custInfo() {
    const c = byId(state.customers, draft.customerId);
    const el = $("#d-cust-info");
    if (el) el.textContent = c ? [c.phone, c.company, c.notes].filter(Boolean).join(" · ") || "No phone saved" : "";
  }
  function readDraft() {
    const v = $("#view");
    if (!$("#d-customer", v)) return;
    draft.customerId = $("#d-customer", v).value;
    draft.date = $("#d-date", v).value;
    draft.dueDate = $("#d-due", v).value;
    if ($("#d-paid", v)) { draft.paidNow = $("#d-paid", v).value; draft.payMethod = $("#d-method", v).value; }
    draft.vat = $("#d-vat", v).checked;
    draft.notes = $("#d-notes", v).value;
    $$(".line", v).forEach((el) => {
      const l = draft.lines[Number(el.dataset.i)];

  }
  function bindEditor() {
    const v = $("#view");

      if (tab !== "new" || !e.target.closest("#d-customer, #d-date, #d-due, #d-paid, #d-method, #d-vat, #d-notes, .line")) return;

      readDraft();
      $$("[data-amt]", v).forEach((el) => { const l = draft.lines[Number(el.dataset.amt)]; el.textContent = sar(lineHal(l.qty, l.price)); });
      const editing = draft.id && byId(state.orders, draft.id);

  function validateDraft() {
    readDraft();
    const v = $("#view");
    if (!draft.customerId) { $("#d-customer", v).classList.add("invalid"); $("#d-customer", v).focus(); return "Select a customer."; }
    if (!draft.lines.length) return "Add at least one item.";
    for (let i = 0; i < draft.lines.length; i++) {
      const l = draft.lines[i], el = $(`.line[data-i="${i}"]`, v);
      if (!String(l.name).trim()) { $('[data-k="name"]', el).classList.add("invalid"); $('[data-k="name"]', el).focus(); return `Item ${i + 1} needs a name.`; }
      if (!(Number(l.qty) > 0)) { $('[data-k="qty"]', el).classList.add("invalid"); $('[data-k="qty"]', el).focus(); return `Item ${i + 1} needs a quantity above zero.`; }
      if (Number(l.price) < 0) { $('[data-k="price"]', el).classList.add("invalid"); return `Item ${i + 1} has a negative price.`; }
    }
    if (draft.dueDate && draft.date && draft.dueDate < draft.date) { $("#d-due", v).classList.add("invalid"); return "Delivery date is before the order date."; }
    const editing = draft.id && byId(state.orders, draft.id);
    const t = totals(editing ? { ...draft, payments: editing.payments } : draft);
    if (editing && t.paid > t.total) return `Payments received (${sar(t.paid)}) are more than the new total of ${sar(t.total)}. Remove a payment first.`;
    if (!editing) {
      const p = hal(draft.paidNow);
      if (p < 0) return "Paid amount cannot be negative.";
      if (p > t.total) { $("#d-paid", v).classList.add("invalid"); return `Paid amount is more than the order total of ${sar(t.total)}.`; }
    }
    return "";
  }
  function saveDraft() {
    const err = validateDraft();

      customerId: c.id, customer: { name: c.name, phone: c.phone, company: c.company },
      date: draft.date || today(), dueDate: draft.dueDate || "", vat: draft.vat, vatRate: draft.vatRate, notes: draft.notes.trim(),
      lines: draft.lines.map((l) => ({ name: String(l.name).trim(), spec: String(l.spec || "").trim(), unit: l.unit || "pcs", qty: Number(l.qty), price: hal(l.price) / 100, note: String(l.note || "").trim() })),
    };

    else {
      o = { id: uid(), no: nextNumber(), status: state.settings.statuses[0] || "New", createdAt: today(), payments: [], device: device.id, ...clean };
      const p = hal(draft.paidNow);

      state.orders.push(o);
    }
    touch("orders", o);
    save();
    draft = newDraft();
    keepDraft();
    return o;
  }

  /* ---------- WhatsApp message ---------- */
  const italic = (t) => (t.includes("_") ? t : `_${t}_`);
  function message(o) {
    const s = state.settings, t = totals(o);
    const out = [`*Job Order ${o.no}*`, `Date: ${fmtDate(o.date)}${o.dueDate ? ` · Delivery: ${fmtDate(o.dueDate)}` : ""}`, `Customer: ${o.customer.name}${o.customer.company ? ` (${o.customer.company})` : ""}`];
    if (o.status && o.status !== s.statuses[0]) out.push(`Status: *${o.status}*`);
    out.push("");
    o.lines.forEach((l, i) => {
      out.push(`${i + 1}. *${l.name}*`);
      if (l.spec) out.push(`   ${italic(l.spec)}`);
      out.push(`   ${qtyFmt(l.qty)} ${l.unit} × ${fmt(hal(l.price))} = ${sar(lineHal(l.qty, l.price))}`);
      if (l.note) out.push(`   Note: ${l.note}`);

  function readStatuses() { $$("[data-st]").forEach((el) => { stEdit[Number(el.dataset.st)].name = el.value; }); }

  /* ---------- backup & restore ---------- */
  const backupName = () => `job-orders-backup-${fmtDate(today())}.json`;
  function backupJson() { return JSON.stringify({ app: "job-orders", exportedAt: nowIso(), ...state }); }
  function restoreFrom(text) {
    let s;
    try { s = JSON.parse(text); if (!Array.isArray(s.orders) || !Array.isArray(s.customers) || !Array.isArray(s.items)) throw 0; }
    catch (err) { return toast("That is not a Job Orders backup."); }
    const n = live(s.orders).length;
    confirmBox("Restore backup", `Replace everything on this device with the backup (${n} orders, ${live(s.customers).length} customers, ${live(s.items).length} items)?${device.sync.url ? " The restored records will also be sent to the shared Drive folder." : ""}`, "Restore", () => {
      delete s.app; delete s.exportedAt;
      state = migrate({ ...blank(), ...s, v: s.v || 1 });
      if (s.seq && !device.next) device.next = s.seq + 1;
      delete state.seq;
      if (device.sync.url) markAllDirty();
      stEdit = null; save(); render(); toast("Backup restored");

  function markAllDirty() {
    TYPES.forEach((t) => state[t].forEach((r) => dirty.add(`${t}:${r.id}`)));
    dirty.add("settings:shared");
  }

  /* ---------- sync with the shared Drive folder ---------- */
  function scheduleSync() {
    if (!device.sync.url) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncNow(false), 3000);
  }
  async function callSync(body) {
    const res = await fetch(device.sync.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ pin: device.sync.pin, ...body }) });
    if (!res.ok) throw new Error(`The sync link answered with error ${res.status}.`);
    let j;
    try { j = await res.json(); } catch (e) { throw new Error("The sync link did not answer like a Job Orders sync script. Check the link."); }
    if (!j.ok) throw new Error(j.error || "Sync failed.");
    return j;
  }
  function applyRecord(t, r) {
    if (t === "settings") {
      const shared = {};
      SHARED.forEach((k) => { if (r[k] !== undefined) shared[k] = r[k]; });
      state.settings = { ...state.settings, ...shared, updatedAt: r.updatedAt };
      stEdit = null;
      return;
    }
    if (!TYPES.includes(t)) return;
    const arr = state[t], i = arr.findIndex((x) => x.id === r.id);
    const clean = { ...r }; delete clean._rev;
    if (i >= 0) arr[i] = clean; else arr.push(clean);
  }
  async function syncNow(manual) {
    const sy = device.sync;
    if (!sy.url || syncing) return;
    if (!navigator.onLine) { sy.error = "No internet connection. Will sync when back online."; banner(); if (manual) toast(sy.error); return; }
    syncing = true; retouched.clear(); banner();
    const sent = [...dirty];
    const changes = sent.map((k) => {
      const [t, id] = k.split(":");
      if (t === "settings") { const r = { id: "shared", updatedAt: state.settings.updatedAt }; SHARED.forEach((f) => (r[f] = state.settings[f])); return { t, r }; }
      const r = (state[t] || []).find((x) => x.id === id);
      return r ? { t, r } : null;
    }).filter(Boolean);
    try {
      const j = await callSync({ action: "sync", since: sy.since || 0, device: device.id, changes });
      sent.forEach((k) => { if (!retouched.has(k)) dirty.delete(k); });
      let got = 0;
      (j.records || []).forEach(({ t, r }) => {
        const k = `${t}:${t === "settings" ? "shared" : r.id}`;
        if (dirty.has(k)) return; // changed again here meanwhile; ours goes up next time
        applyRecord(t, r); got++;
      });
      if (state.demo && got && live(state.orders).length) state.demo = !!state.demo;
      sy.since = j.rev; sy.lastAt = nowIso(); sy.error = "";
      sy.lastMsg = `${changes.length} sent, ${got} received.`;
      persist();
      if (manual) toast(`Synced. ${sy.lastMsg}`);
      refreshAfterSync(got);
    } catch (e) {
      sy.error = e && e.message && !/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? e.message : "Could not reach the sync link. Check the internet and the link.";
      persist();
      if (manual) toast(sy.error);
    } finally {
      syncing = false; banner();
      if (dirty.size && !sy.error) scheduleSync();
    }
  }
  function refreshAfterSync(got) {
    const f = document.activeElement;
    const typing = f && $("#view").contains(f) && /INPUT|TEXTAREA|SELECT/.test(f.tagName);
    if ((got || tab === "settings") && !typing) render(); // never interrupt someone typing
    if (dlgCtx && dlg.open) {
      if (dlgCtx.kind === "order") openOrder(byId(state.orders, dlgCtx.id));
      if (dlgCtx.kind === "customer") openCustomer(byId(state.customers, dlgCtx.id));
    }
  }
  window.addEventListener("online", () => syncNow(false));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(false); });
  setInterval(() => { if (!document.hidden) syncNow(false); }, 60000);

  /* ---------- events ---------- */
  document.addEventListener("click", async (e) => {
    const wa = NATIVE && e.target.closest("#wa-link");
    if (wa) { e.preventDefault(); window.location.href = wa.href; return; } // Android opens the WhatsApp app
    const tb = e.target.closest("[data-tab]");
    if (tb) return go(tb.dataset.tab);
    const sf = e.target.closest("[data-status-filter]");
    if (sf) { filters.status = sf.dataset.statusFilter; return render(); }
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const id = b.dataset.id;
    switch (b.dataset.act) {
      case "confirm-yes": { const f = confirmYes; confirmYes = null; closeDlg(); return f && f(); }
      /* editor */
      case "add-item": {
        readDraft();
        const it = byId(state.items, $("#d-additem").value);
        if (!it) return toast("Choose an item from the list first.");
        draft.lines.push({ name: it.name, spec: it.spec, unit: it.unit, qty: "", price: it.price, note: "" });
        keepDraft(); render();
        const last = $$(".line").pop(); if (last) $('[data-k="qty"]', last).focus();
        return;
      }
      case "add-custom": readDraft(); draft.lines.push({ name: "", spec: "", unit: "pcs", qty: "", price: "", note: "" }); keepDraft(); render(); { const last = $$(".line").pop(); if (last) $('[data-k="name"]', last).focus(); } return;
      case "rm-line": readDraft(); draft.lines.splice(Number(b.dataset.i), 1); keepDraft(); return render();
      case "clear-draft": draft = newDraft(); keepDraft(); return render();
      case "save-order": { const o = saveDraft(); if (o) { toast(`${o.no} saved`); go("orders"); } return; }
      case "save-share": { const o = saveDraft(); if (o) { go("orders"); shareDlg(o); } return; }
      /* orders */
      case "open-order": return openOrder(byId(state.orders, id));
      case "share-order": return shareDlg(byId(state.orders, id), true);
      case "share-back": case "pay-back": return openOrder(byId(state.orders, id));
      case "copy-msg": return toast((await copy($("#msg").value)) ? "Copied. Paste it in WhatsApp." : "Select the text and copy it manually.");
      case "share-other":
        try { await Plug.Share.share({ text: $("#msg").value, dialogTitle: "Send order with…" }); } catch (err) { /* closed */ }
        return;
      case "add-payment": return paymentDlg(byId(state.orders, id), false);
      case "mark-paid": return paymentDlg(byId(state.orders, id), true);
      case "save-payment": {
        const o = byId(state.orders, id);
        const amt = hal($("#p-amount").value), bal = totals(o).bal;
        if (amt <= 0) { $("#p-amount").classList.add("invalid"); return toast("Enter an amount above zero."); }
        if (amt > bal) { $("#p-amount").classList.add("invalid"); return toast(`That is more than the balance of ${sar(bal)}.`); }
        const method = ($("#p-method .on") || {}).dataset?.m || "Cash";
        o.payments.push({ id: uid(), date: $("#p-date").value || today(), amount: amt / 100, method, note: $("#p-note").value.trim() });
        touch("orders", o); save(); if (tab === "orders") render();
        openOrder(o);
        return toast(totals(o).bal <= 0 ? `${o.no} fully paid` : `Payment of ${sar(amt)} saved`);
      }
      case "del-payment": {
        const o = byId(state.orders, id), p = o.payments.find((x) => x.id === b.dataset.pid);
        return confirmBox("Delete payment", `Delete the ${esc(p.method)} payment of <b>${sar(hal(p.amount))}</b> on ${fmtDate(p.date)} from ${esc(o.no)}?`, "Delete payment", () => {
          o.payments = o.payments.filter((x) => x.id !== p.id); touch("orders", o); save(); if (tab === "orders") render(); openOrder(o); toast("Payment deleted");
        });
      }
      case "edit-order": {
        const o = byId(state.orders, id);
        draft = { id: o.id, customerId: o.customerId, lines: o.lines.map((l) => ({ ...l })), vat: o.vat, vatRate: o.vatRate, notes: o.notes, date: o.date, dueDate: o.dueDate };
        if (!byId(state.customers, o.customerId)) draft.customerId = "";
        keepDraft(); closeDlg(); return go("new");
      }
      case "dup-order": {
        const o = byId(state.orders, id);
        draft = newDraft({ customerId: byId(state.customers, o.customerId) ? o.customerId : "", lines: o.lines.map((l) => ({ ...l })), vat: o.vat, vatRate: o.vatRate, notes: o.notes });
        keepDraft(); closeDlg(); go("new"); return toast(`Copied ${o.no} into a new order`);
      }
      case "del-order": { const o = byId(state.orders, id); return confirmBox("Delete order", `Delete <b>${esc(o.no)}</b> for ${esc(o.customer.name)}? This cannot be undone.`, "Delete order", () => { o.deleted = true; touch("orders", o); save(); render(); toast(`${o.no} deleted`); }); }
      /* customers */
      case "new-customer": return customerForm(null, b.dataset.for === "draft");
      case "open-customer": return openCustomer(byId(state.customers, id));
      case "edit-customer": return customerForm(byId(state.customers, id));
      case "save-customer": {
        const name = $("#c-name").value.trim();
        if (!name) { $("#c-name").classList.add("invalid"); $("#c-name").focus(); return toast("Enter the customer name."); }
        const data = { name, phone: $("#c-phone").value.trim(), company: $("#c-company").value.trim(), notes: $("#c-notes").value.trim() };
        let c = id && byId(state.customers, id);
        if (c) Object.assign(c, data); else { c = { id: uid(), ...data }; state.customers.push(c); }
        touch("customers", c);
        if (b.dataset.for === "draft") { readDraft(); draft.customerId = c.id; keepDraft(); }
        save(); closeDlg(); render(); return toast(id ? "Customer updated" : "Customer saved");
      }
      case "order-for": if (draft.id) draft = newDraft(); draft.customerId = id; keepDraft(); closeDlg(); return go("new");
      case "del-customer": { const c = byId(state.customers, id); return confirmBox("Delete customer", `Delete <b>${esc(c.name)}</b>? Their saved orders stay in the Orders list.`, "Delete customer", () => { c.deleted = true; touch("customers", c); if (draft.customerId === id) draft.customerId = ""; save(); render(); toast("Customer deleted"); }); }
      /* items */
      case "new-item": return itemForm(null);
      case "edit-item": return itemForm(byId(state.items, id));
      case "save-item": {
        const name = $("#i-name").value.trim(), price = $("#i-price").value;
        if (!name) { $("#i-name").classList.add("invalid"); $("#i-name").focus(); return toast("Enter the item name."); }
        if (price === "" || Number(price) < 0) { $("#i-price").classList.add("invalid"); $("#i-price").focus(); return toast("Enter a price of 0 or more."); }
        const data = { name, spec: $("#i-spec").value.trim(), unit: $("#i-unit").value, price: hal(price) / 100 };
        let it = id && byId(state.items, id);
        if (it) Object.assign(it, data); else { it = { id: uid(), ...data }; state.items.push(it); }
        touch("items", it);
        save(); closeDlg(); render(); return toast(id ? "Item updated" : "Item saved");
      }
      case "del-item": { const it = byId(state.items, id); return confirmBox("Delete item", `Delete <b>${esc(it.name)}</b>? Orders that already use it are not changed.`, "Delete item", () => { it.deleted = true; touch("items", it); save(); render(); toast("Item deleted"); }); }
      /* settings */
      case "save-settings": {
        const rate = Number($("#s-rate").value), dueRaw = $("#s-due").value.trim();
        if (!(rate >= 0 && rate <= 100)) { $("#s-rate").classList.add("invalid"); return toast("VAT rate must be between 0 and 100."); }
        Object.assign(state.settings, { companyName: $("#s-company").value.trim(), phone: $("#s-phone").value.trim(), footer: $("#s-footer").value.trim(), vatDefault: $("#s-vat").checked, vatRate: rate, dueDays: dueRaw === "" ? "" : Math.max(0, parseInt(dueRaw, 10) || 0) });
        touch("settings", state.settings);
        if (!draft.lines.length && !draft.id) { draft = newDraft({ customerId: draft.customerId }); keepDraft(); }
        save(); render(); return toast("Company settings saved");
      }
      case "st-add": readStatuses(); stEdit.splice(stEdit.length - 2, 0, { old: "", name: "" }); render(); { const el = $$("[data-st]")[stEdit.length - 3]; if (el) el.focus(); } return;
      case "st-up": case "st-down": { readStatuses(); const i = Number(b.dataset.i), j = b.dataset.act === "st-up" ? i - 1 : i + 1; [stEdit[i], stEdit[j]] = [stEdit[j], stEdit[i]]; return render(); }
      case "st-del": readStatuses(); stEdit.splice(Number(b.dataset.i), 1); return render();
      case "st-save": {
        readStatuses();
        const names = stEdit.map((x) => x.name.trim());
        if (names.some((n) => !n)) return toast("A status name is empty. Type a name or delete it.");
        if (new Set(names.map((n) => n.toLowerCase())).size !== names.length) return toast("Two statuses have the same name.");
        stEdit.forEach((x, i) => {
          if (x.old && x.old !== names[i]) state.orders.forEach((o) => { if (o.status === x.old) { o.status = names[i]; touch("orders", o); } });
        });
        state.settings.statuses = names; touch("settings", state.settings);
        stEdit = null; save(); render(); return toast("Statuses saved");
      }
      case "theme": device.theme = b.dataset.themeSet; applyTheme(); persist(); return render();
      case "save-device": {
        const series = $("#d-series").value.trim().toUpperCase(), next = parseInt($("#d-next").value, 10);
        if (!/^[A-Z0-9][A-Z0-9-]{0,9}$/.test(series)) { $("#d-series").classList.add("invalid"); return toast("Series can use letters, numbers and dashes, for example JO-A."); }
        if (!(next >= 1)) { $("#d-next").classList.add("invalid"); return toast("Next number must be 1 or more."); }
        device.series = series.replace(/-+$/, ""); device.next = next; persist(); render();
        return toast(`Next order will be ${previewNumber()}`);
      }
      case "sync-connect": case "sync-test": {
        const url = (b.dataset.act === "sync-connect" ? $("#y-url").value : device.sync.url).trim(), pin = (b.dataset.act === "sync-connect" ? $("#y-pin").value : device.sync.pin).trim();
        if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { $("#y-url").classList.add("invalid"); return toast("Paste the sync link that starts with https://script.google.com/"); }
        if (!pin) { $("#y-pin").classList.add("invalid"); return toast("Enter the team PIN."); }
        const prev = { ...device.sync };
        device.sync.url = url; device.sync.pin = pin;
        b.disabled = true; b.textContent = "Checking…";
        try {
          await callSync({ action: "ping" });
          if (b.dataset.act === "sync-test") { toast("Connection works."); device.sync = prev; device.sync.error = ""; persist(); return render(); }
          device.sync = { url, pin, since: 0, lastAt: "", lastMsg: "", error: "" };
          if (state.demo) { state = blank(); draft = newDraft(); keepDraft(); dirty.clear(); } else markAllDirty();
          persist(); render(); toast("Connected. Syncing now…");
          if (device.series === "JO") toast("Connected. Set a different order series for this device, e.g. JO-B.");
          await syncNow(true);
        } catch (err) {
          device.sync = prev; persist(); render();
          toast(err && err.message && !/Failed to fetch|NetworkError|Load failed/i.test(err.message) ? err.message : "Could not reach the sync link. Check the internet and the link.");
        }
        return;
      }
      case "sync-now": return syncNow(true);
      case "sync-off": return confirmBox("Turn off sync", "Stop syncing this device? Its data stays here, and the shared Drive folder is not changed.", "Turn off", () => { device.sync = { url: "", pin: "", since: 0, lastAt: "", lastMsg: "", error: "" }; persist(); render(); toast("Sync turned off on this device"); });
      case "copy-backup": {
        const txt = backupJson();
        if (NATIVE && Plug.Clipboard) { try { await Plug.Clipboard.write({ string: txt }); return toast("Backup copied. Paste it somewhere safe."); } catch (err) { /* fall back below */ } }
        try { await navigator.clipboard.writeText(txt); return toast("Backup copied. Paste it somewhere safe."); }
        catch (err) { const ta = $("#s-restore"); ta.value = txt; ta.focus(); ta.select(); return toast("Backup text is in the box below. Copy it from there."); }
      }
      case "share-backup": {
        try {
          const w = await Plug.Filesystem.writeFile({ path: backupName(), data: backupJson(), directory: "CACHE", encoding: "utf8" });
          await Plug.Share.share({ title: backupName(), files: [w.uri], dialogTitle: "Save backup to…" });
        } catch (err) { if (err && !/cancel/i.test(String(err.message || err))) toast("Could not share the backup file."); }
        return;
      }
      case "download-backup": {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([backupJson()], { type: "application/json" }));
        a.download = backupName(); document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
        return toast(`Saved ${backupName()} to Downloads`);
      }
      case "restore-file": { const f = $("#restore-file"); f.value = ""; return f.click(); }
      case "restore": return restoreFrom($("#s-restore").value);
      case "clear-sample": return confirmBox("Clear sample data", "Remove the sample customers, items and orders? Your company settings are kept.", "Clear samples", () => { const keep = state.settings; state = blank(); state.settings = { ...keep, companyName: keep.companyName.replace(/\s*\(Sample\)$/, ""), phone: keep.phone === "+966 12 000 0000" ? "" : keep.phone, dueDays: "", updatedAt: nowIso() }; device.next = 1; dirty.clear(); draft = newDraft(); keepDraft(); stEdit = null; save(); render(); toast("Samples cleared. Add your first item."); });
      case "load-sample": return confirmBox("Load sample data", "Replace everything on this device with sample data? Share a backup first if you want to keep your records.", "Load samples", () => { state = sample(); dirty.clear(); draft = newDraft(); keepDraft(); stEdit = null; persist(); render(); toast("Sample data loaded"); });
      case "wipe": return confirmBox("Delete everything", `Delete all orders, customers, items and settings on this device? This cannot be undone.${device.sync.url ? " The shared Drive folder is not changed." : ""}`, "Delete everything", () => { state = blank(); state.demo = false; dirty.clear(); device.sync.since = 0; draft = newDraft(); keepDraft(); stEdit = null; persist(); render(); toast("All data deleted on this device"); });
    }
  });
  document.addEventListener("input", (e) => {
    const map = { "o-search": "q", "c-search": "cq", "i-search": "iq" };
    const k = map[e.target.id];
    if (k) { filters[k] = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#" + e.target.id); el.focus(); el.setSelectionRange(pos, pos); }
    else if (e.target.classList.contains("invalid")) e.target.classList.remove("invalid");
  });
  $("#restore-file").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => restoreFrom(String(r.result));
    r.onerror = () => toast("Could not read that file.");
    r.readAsText(f);
  });

  if (NATIVE && Plug.App) {
    Plug.App.addListener("backButton", () => {
      if (dlg.open) closeDlg();
      else if (tab !== "new") go("new");
      else Plug.App.exitApp();
    });
  }

  go(["new", "orders", "customers", "items", "settings"].includes(tab) ? tab : "new");
  if (device.sync.url) syncNow(false);
})();
</script>
</body>
</html>
