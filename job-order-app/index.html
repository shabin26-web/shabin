<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a5fb4">
<title>Job Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first. Sticky app bar under the status bar, content column, and a
   bottom navigation with a raised "New" button. Dialogs open as bottom sheets on
   phones. Soft white cards on a cool grey ground; blue for actions, WhatsApp green
   only for sending, red/amber/green only for money and status signals. */
:root {
  --bg: #eef1f6;
  --card: #ffffff;
  --card-2: #f6f8fb;
  --ink: #141820;
  --ink-2: #4a5263;
  --ink-3: #8089a0;
  --line: #e2e6ee;
  --line-2: #eef1f6;
  --accent: #0a5fb4;
  --accent-ink: #ffffff;
  --accent-soft: #e3eefb;
  --wa: #1a8f4c;
  --wa-ink: #ffffff;
  --good: #1b7a44; --good-soft: #e1f3e8;
  --warn: #9a6200; --warn-soft: #fcf0d3;
  --bad: #c0262d; --bad-soft: #fde6e6;
  --info: #0a5fb4; --info-soft: #e3eefb;
  --shadow: 0 1px 2px rgb(20 24 32 / .05), 0 4px 14px rgb(20 24 32 / .06);
  --shadow-up: 0 -2px 16px rgb(20 24 32 / .08);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px;
  --nav: 64px;
  /* status bar / gesture bar space: Capacitor injects --safe-area-inset-*, browsers use env() */
  --sat: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
  --sab: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --card: #181c23; --card-2: #1e232c; --ink: #e9ecf2; --ink-2: #b4bccb; --ink-3: #848ea2;
    --line: #2a303b; --line-2: #222731; --accent: #6aaef0; --accent-ink: #0b1626; --accent-soft: #1b2b40;
    --wa: #2fb866; --wa-ink: #08180e;
    --good: #5cc98a; --good-soft: #15301f; --warn: #e8b547; --warn-soft: #33290f; --bad: #f2827a; --bad-soft: #3a1c1b; --info: #6aaef0; --info-soft: #1b2b40;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 14px rgb(0 0 0 / .25); --shadow-up: 0 -2px 16px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --card: #181c23; --card-2: #1e232c; --ink: #e9ecf2; --ink-2: #b4bccb; --ink-3: #848ea2;
  --line: #2a303b; --line-2: #222731; --accent: #6aaef0; --accent-ink: #0b1626; --accent-soft: #1b2b40;
  --wa: #2fb866; --wa-ink: #08180e;
  --good: #5cc98a; --good-soft: #15301f; --warn: #e8b547; --warn-soft: #33290f; --bad: #f2827a; --bad-soft: #3a1c1b; --info: #6aaef0; --info-soft: #1b2b40;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 14px rgb(0 0 0 / .25); --shadow-up: 0 -2px 16px rgb(0 0 0 / .35);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 1.5rem; font-weight: 800; }
h2 { font-size: 1.05rem; font-weight: 700; }
h3 { font-size: .95rem; font-weight: 700; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { text-align: right; white-space: nowrap; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.spec { font-style: italic; }
a { color: var(--accent); }

/* ---------- app bar ---------- */
.appbar { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: calc(var(--sat) + 10px) 16px 10px; }
.appbar-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand .mark { width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 14px var(--f-display); overflow: hidden; }
.brand .mark img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.brand b { font: 700 1rem/1.2 var(--f-display); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand small { color: var(--ink-3); font-size: 12px; }
.sync-ind { font: 500 12px var(--f-body); color: var(--ink-2); background: var(--card); border: 0; border-radius: 999px; padding: 6px 10px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; box-shadow: var(--shadow); white-space: nowrap; }
.sync-ind::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.sync-ind.err::before { background: var(--bad); }
.sync-ind.busy::before { background: var(--warn); }

.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 4px calc(var(--nav) + var(--sab) + 40px); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 6px 0 14px; }
.page-head p { margin: 2px 0 0; color: var(--ink-3); font-size: 13px; }
.back { background: none; border: 0; color: var(--accent); font: 600 14px var(--f-body); padding: 4px 0; cursor: pointer; margin-bottom: 2px; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: var(--r); padding: 10px 14px; font-size: 13px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

/* ---------- bottom nav ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--card); box-shadow: var(--shadow-up); padding-bottom: var(--sab); }
.nav-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: var(--nav); align-items: center; }
.nav button { background: none; border: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 500 11px var(--f-body); color: var(--ink-3); cursor: pointer; }
.nav svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button.on { color: var(--accent); font-weight: 600; }
.nav .plus { width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: -26px; box-shadow: 0 6px 16px rgb(10 95 180 / .35); }
.nav .plus svg { width: 26px; height: 26px; stroke-width: 2.4; }
.nav button.new-btn { gap: 2px; }
.nav button.new-btn.on { color: var(--accent); }

/* ---------- controls ---------- */
.btn { font: 600 14px/1 var(--f-body); border: 0; background: var(--card-2); color: var(--ink); padding: 12px 16px; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; min-height: 46px; }
.btn:hover { filter: brightness(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.wa { background: var(--wa); color: var(--wa-ink); }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; color: var(--accent); padding-inline: 6px; min-height: 36px; }
.btn.sm { min-height: 38px; padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row > .btn { flex: 1 1 140px; }

label.f { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
label.f > span, .lbl { font-size: 12px; font-weight: 600; color: var(--ink-2); }
input, select, textarea { font: 16px var(--f-body); color: var(--ink); background: var(--card-2); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 46px; }
input[type="number"] { font-family: var(--f-mono); }
textarea { min-height: 72px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px var(--accent-soft); }
.invalid { border-color: var(--bad) !important; box-shadow: 0 0 0 3px var(--bad-soft) !important; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 500; min-height: 46px; }
.check input { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.full { grid-column: 1 / -1; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--card-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { background: transparent; border: 0; border-radius: 9px; min-height: 38px; font: 600 13px var(--f-body); color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--card); color: var(--accent); box-shadow: var(--shadow); }

.card { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.section { display: flex; flex-direction: column; gap: 14px; }
.section + .section, .card + .card { margin-top: 12px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-title { display: flex; align-items: center; justify-content: space-between; margin: 20px 2px 8px; }
.sec-title h2 { font-size: 1rem; }

/* ---------- home ---------- */
.hello { margin: 6px 0 14px; }
.hello h1 { font-size: 1.6rem; }
.hello p { margin: 2px 0 0; color: var(--ink-3); font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--card); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); border: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; display: flex; flex-direction: column; gap: 4px; min-height: 92px; }
.tile .k { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.tile .v { font: 600 1.35rem/1.15 var(--f-mono); }
.tile .v small { font-size: .7rem; color: var(--ink-3); font-weight: 500; }
.tile.bad .v { color: var(--bad); }
.tile.good .v { color: var(--good); }
.tile.warn .v { color: var(--warn); }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.quick .btn { flex-direction: column; min-height: 76px; font-size: 12.5px; gap: 6px; background: var(--card); box-shadow: var(--shadow); }
.quick .btn svg { width: 24px; height: 24px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.row { background: var(--card); border: 0; border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; box-shadow: var(--shadow); }
.row .t { font-weight: 600; overflow-wrap: anywhere; }
.row .s { color: var(--ink-3); font-size: 13px; overflow-wrap: anywhere; }
.row .r { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.row .amt { font: 600 15px var(--f-mono); }
.search { margin-bottom: 10px; background: var(--card); box-shadow: var(--shadow); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px 4px; scrollbar-width: none; }
.chip { flex: none; border: 0; background: var(--card); color: var(--ink-2); border-radius: 999px; padding: 8px 13px; font: 600 13px var(--f-body); cursor: pointer; box-shadow: var(--shadow); }
.chip.on { background: var(--ink); color: var(--card); }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--line-2); color: var(--ink-2); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.done { background: var(--line-2); color: var(--ink-2); }
.pills { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.empty { text-align: center; color: var(--ink-3); padding: 26px 12px; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); }
.due-sum { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; background: var(--card); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.due-sum b { font: 600 17px var(--f-mono); }
.due-sum b.has { color: var(--bad); }
.sum-card { background: var(--card); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-size: 14px; box-shadow: var(--shadow); }
.sum-card .big { font: 600 18px var(--f-mono); color: var(--good); }

/* ---------- more menu ---------- */
.menu { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.menu button { width: 100%; border: 0; background: none; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 14px; text-align: left; font: inherit; color: inherit; cursor: pointer; border-bottom: 1px solid var(--line-2); }
.menu button:last-child { border-bottom: 0; }
.menu .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; }
.menu .ic svg { width: 21px; height: 21px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.menu b { display: block; font-weight: 600; }
.menu small { color: var(--ink-3); font-size: 12.5px; }
.menu .chev { color: var(--ink-3); font-size: 20px; }

/* ---------- order editor ---------- */
.line { border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--card-2); }
.line input, .line select { background: var(--card); }
.line-head { display: flex; align-items: center; gap: 8px; }
.line-head .n { font: 600 12px var(--f-mono); color: var(--ink-3); width: 22px; flex: none; }
.line-head input { flex: 1; font-weight: 600; }
.line .amt { font: 600 15px var(--f-mono); text-align: right; }
.icon-btn { background: none; border: 0; width: 40px; height: 40px; flex: none; border-radius: 10px; color: var(--ink-3); font-size: 22px; cursor: pointer; }
.icon-btn:hover { background: var(--line-2); color: var(--bad); }
.icon-btn:disabled { opacity: .3; cursor: not-allowed; }
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.disc-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 8px; align-items: end; }
.totals { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 14px; }
.totals .num { font-size: 15px; }
.totals .grand { font-weight: 700; font-size: 16px; border-top: 1px solid var(--line); padding-top: 8px; }
.totals .bal { color: var(--accent); }
.totals .disc { color: var(--good); }

/* ---------- sheets (dialogs) ---------- */
dialog { border: 0; padding: 0; width: min(600px, 100vw); max-height: calc(100dvh - var(--sat) - 12px); border-radius: 20px 20px 0 0; background: var(--card); color: var(--ink); box-shadow: var(--shadow-up); margin: auto auto 0; }
dialog::backdrop { background: rgb(10 12 16 / .5); }
@media (min-width: 700px) { dialog { border-radius: 20px; margin: auto; max-height: calc(100dvh - 48px); } }
.dlg { display: flex; flex-direction: column; max-height: inherit; }
.grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px 8px; }
.dlg-body { padding: 4px 16px 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.dlg-body > * { flex-shrink: 0; }
.dlg-foot { padding: 12px 16px calc(14px + var(--sab)); border-top: 1px solid var(--line-2); display: flex; flex-wrap: wrap; gap: 8px; }
.dlg-foot > .btn { flex: 1 1 110px; }
.close { background: var(--card-2); border: 0; font-size: 22px; line-height: 1; color: var(--ink-2); cursor: pointer; width: 36px; height: 36px; border-radius: 50%; }

.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.acts .btn { flex-direction: column; min-height: 66px; font-size: 12px; gap: 5px; padding: 8px 6px; text-align: center; line-height: 1.2; }
.acts .btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.acts .btn.wa svg { fill: currentColor; stroke: none; }
.acts .btn.accent { background: var(--accent-soft); color: var(--accent); }

.ticket { border-radius: var(--r); overflow: hidden; background: var(--card-2); }
.ticket-top { padding: 12px 14px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-bottom: 1px dashed var(--line); }
.ticket-top b { font-family: var(--f-mono); }
.ticket table { width: 100%; border-collapse: collapse; font-size: 14px; }
.ticket td { padding: 8px 14px; border-top: 1px solid var(--line-2); vertical-align: top; }
.ticket td small { display: block; color: var(--ink-3); }
.ticket .totals { padding: 10px 14px 14px; border-top: 1px solid var(--line); }
.msg { font: 13.5px/1.5 var(--f-mono); min-height: 300px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.pay-list { display: flex; flex-direction: column; gap: 6px; }
.pay-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: 14px; padding: 8px 10px; background: var(--card-2); border-radius: 10px; }
.rno { font-family: var(--f-mono); font-size: 12.5px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
.receipt { border-radius: var(--r); overflow: hidden; background: var(--card-2); }
.receipt-top { background: var(--good-soft); color: var(--good); padding: 14px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.receipt-top b { font: 600 15px var(--f-mono); }
.receipt-amt { padding: 16px 14px 6px; font: 600 26px var(--f-mono); }
.receipt .kv { padding: 6px 14px 14px; }
.logo-box { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo-box img { max-height: 56px; max-width: 160px; border-radius: 8px; background: #fff; padding: 4px; }
.pdf-prev { border-radius: 10px; background: #fff; min-height: 160px; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); }
.pdf-prev img { width: 100%; display: block; }
.st-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; }
.st-row .icon-btn { width: 36px; height: 36px; font-size: 16px; }
.meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); }
.meter.hot span { background: var(--bad); }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 13.5px; }
.bar-row .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.bar-row .bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.rtable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.rtable th { text-align: left; font-size: 11.5px; color: var(--ink-3); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.rtable td { padding: 7px 4px; border-bottom: 1px solid var(--line-2); }
.rtable tfoot td { font-weight: 700; border-bottom: 0; border-top: 1px solid var(--line); }
.rtable .num { font-size: 13px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav) + var(--sab) + 14px); background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow); z-index: 60; max-width: calc(100vw - 32px); font-size: 14px; }
@media (max-width: 380px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid3 .amt-cell { grid-column: 1 / -1; } .quick .btn { font-size: 11.5px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- helpers ---------- */
  const $ = (s, el = document) => el.querySelector(s);

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const nowIso = () => new Date().toISOString();
  function today() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function addDays(iso, n) { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /** 2026-10-01 -> 01-Oct-26 */
  function fmtDate(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}-${MON[Number(m) - 1]}-${y.slice(2)}`; }

  function fmtTime(iso) { const d = new Date(iso); return isNaN(d) ? "" : `${fmtDate(new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10))} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
  // money is kept in halalas (integer 1/100 SAR) for every calculation
  const hal = (v) => { const n = Number(v); return Number.isFinite(n) ? Math.sign(n) * Math.round(Math.abs(n) * 100) : 0; };
  const lineHal = (qty, price) => { const v = (Number(qty) || 0) * (Number(price) || 0); return Math.sign(v) * Math.round(Math.abs(v) * 100); };
  const fmt = (h) => (h / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const sar = (h) => `SAR ${fmt(h)}`;
  const qtyFmt = (q) => Number(q || 0).toLocaleString("en-US", { maximumFractionDigits: 3 });
  function waPhone(phone) {
    let d = String(phone || "").replace(/\D/g, "");
    if (d.startsWith("00")) d = d.slice(2);
    if (d.length === 10 && d.startsWith("05")) d = "966" + d.slice(1);
    else if (d.length === 9 && d.startsWith("5")) d = "966" + d;
    return d.length >= 8 ? d : "";
  }
  /** Subtotal → discount → taxable → VAT on taxable → total; then payments and balance. */
  function totals(o) {
    const sub = (o.lines || []).reduce((s, l) => s + lineHal(l.qty, l.price), 0);
    const d = o.discount || {};
    const dv = Number(d.value) || 0;
    let disc = 0;
    if (dv > 0) disc = d.type === "pct" ? Math.round((sub * Math.min(dv, 100)) / 100) : Math.min(hal(dv), sub);
    const taxable = sub - disc;
    const rate = o.vat ? Number(o.vatRate || 15) : 0;
    const vat = Math.round((taxable * rate) / 100);
    const total = taxable + vat;
    const paid = (o.payments || []).reduce((s, p) => s + hal(p.amount), 0);
    return { sub, disc, taxable, rate, vat, total, paid, bal: total - paid };
  }
  const discLabel = (o) => { const d = o.discount || {}; return d.type === "pct" ? `Discount ${Number(d.value)}%` : "Discount"; };
  function payState(o) {
    const t = totals(o);
    if (t.total > 0 && t.bal <= 0) return { label: "Paid", tone: "good" };

  let storageOk = true;

  function sample() {
    const s = blank();

      cu("Ahmed Al-Harbi", "0550000001", "Red Sea Dental Clinics", "Al Rawdah branch"),

  /** Render the document to A5 pages, cutting only between rows/blocks. */
  async function makePdf(html, name) {
    const stage = $("#pdf-stage");
    stage.innerHTML = html;
    const doc = stage.firstElementChild;
    await Promise.all($$("img", doc).map((im) => (im.decode ? im.decode().catch(() => {}) : null)));
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const total = doc.offsetHeight;
    const top0 = doc.getBoundingClientRect().top;
    const breaks = $$("[data-brk]", doc).map((el) => el.getBoundingClientRect().bottom - top0);
    const cuts = [0];
    const TOP = 26, BOTTOM = 22;
    while (cuts[cuts.length - 1] < total) {
      const start = cuts[cuts.length - 1];
      const limit = start + PAGE_H - (start ? TOP : 0) - BOTTOM;
      if (limit >= total) { cuts.push(total); break; }
      const fit = breaks.filter((y) => y > start + 40 && y <= limit);
      cuts.push(fit.length ? Math.max(...fit) : limit);
    }
    const scale = 2;
    const canvas = await window.html2canvas(doc, { scale, backgroundColor: "#ffffff", useCORS: true, logging: false, width: PAGE_W, windowWidth: PAGE_W });
    stage.innerHTML = "";
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "pt", format: "a5", orientation: "portrait", compress: true });
    const pw = pdf.internal.pageSize.getWidth(), k = pw / PAGE_W;
    const pages = cuts.length - 1;
    let preview = "";
    for (let i = 0; i < pages; i++) {
      const y0 = cuts[i], h = cuts[i + 1] - y0;
      const c = document.createElement("canvas");
      c.width = PAGE_W * scale; c.height = Math.ceil(h * scale);
      const g = c.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(canvas, 0, Math.floor(y0 * scale), c.width, c.height, 0, 0, c.width, c.height);
      const img = c.toDataURL("image/jpeg", 0.9);
      if (!i) preview = img;
      if (i) pdf.addPage("a5", "portrait");
      pdf.addImage(img, "JPEG", 0, (i ? TOP : 0) * k, pw, h * k);
      if (pages > 1) { pdf.setFontSize(8); pdf.setTextColor(125, 133, 148); pdf.text(`${name.replace(/\.pdf$/, "")} · page ${i + 1} of ${pages}`, pw / 2, pdf.internal.pageSize.getHeight() - 10, { align: "center" }); }
    }
    const uri = pdf.output("datauristring");
    return { name, pages, preview, base64: uri.slice(uri.indexOf(",") + 1), blob: pdf.output("blob") };
  }
  let lastPdf = null;
  /** kind: order | dn | receipt | statement */
  async function pdfDlg(kind, o, p) {

  function saveBlob(blob, name) {
    const a = document.createElement("a");

  async function sharePdf(r) {
    if (NATIVE && Plug.Filesystem && Plug.Share) {
      const w = await Plug.Filesystem.writeFile({ path: r.name, data: r.base64, directory: "CACHE" });
      await Plug.Share.share({ title: r.name, files: [w.uri], dialogTitle: "Send PDF with…" });
      return;
    }
    const file = new File([r.blob], r.name, { type: "application/pdf" });

    saveBlob(r.blob, r.name);

  /** Shrink a chosen logo to max 400 px and keep it as a small data URL. */
  function loadLogo(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = () => reject(new Error("Could not read that image."));
      fr.onload = () => {
        const im = new Image();
        im.onerror = () => reject(new Error("That file is not an image the app can read."));
        im.onload = () => {
          const k = Math.min(1, 400 / Math.max(im.width, im.height));
          const c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
          const g = c.getContext("2d");
          g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
          g.drawImage(im, 0, 0, c.width, c.height);
          const png = c.toDataURL("image/png"), jpg = c.toDataURL("image/jpeg", 0.88);
          resolve(png.length < jpg.length * 1.3 ? png : jpg);
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  /* ---------- reports ---------- */
  function reportData() {
    const [from, to] = periodRange(filters.rep);
    const inP = (d) => d >= from && d <= to;
    const os = jobs().filter((o) => o.status !== "Cancelled" && inP(o.date));
    const sales = os.reduce((s, o) => s + totals(o).total, 0);
    const recv = allReceipts().filter((x) => inP(x.p.date));
    const collected = recv.reduce((s, x) => s + hal(x.p.amount), 0);
    const due = jobs().reduce((s, o) => s + dueOf(o), 0);
    const months = {};
    os.forEach((o) => { const m = o.date.slice(0, 7); (months[m] = months[m] || { s: 0, c: 0, n: 0 }).s += totals(o).total; months[m].n++; });
    recv.forEach((x) => { const m = x.p.date.slice(0, 7); (months[m] = months[m] || { s: 0, c: 0, n: 0 }).c += hal(x.p.amount); });
    const custs = {}, items = {};
    os.forEach((o) => {
      const k = o.customerId; (custs[k] = custs[k] || { name: o.customer.name, v: 0, n: 0 }).v += totals(o).total; custs[k].n++;
      o.lines.forEach((l) => { const key = l.name.trim().toLowerCase(); (items[key] = items[key] || { name: l.name, v: 0, q: 0, unit: l.unit }).v += lineHal(l.qty, l.price); items[key].q += Number(l.qty) || 0; });
    });
    const top = (obj) => Object.values(obj).sort((a, b) => b.v - a.v).slice(0, 5);
    return { from, to, os, recv, sales, collected, due, months: Object.entries(months).sort((a, b) => b[0].localeCompare(a[0])), topC: top(custs), topI: top(items) };
  }

  function csvText(kind) {
    const r = reportData();
    const h = (x) => (x / 100).toFixed(2);
    let rows;
    if (kind === "orders") {
      rows = [["Order no", "Date", "Delivery", "Customer", "Company", "Phone", "Status", "Subtotal", "Discount", "VAT", "Total", "Paid", "Balance"]];
      r.os.forEach((o) => { const t = totals(o); rows.push([o.no, o.date, o.dueDate, o.customer.name, o.customer.company, o.customer.phone, o.status, h(t.sub), h(t.disc), h(t.vat), h(t.total), h(t.paid), h(t.bal)]); });
    } else if (kind === "lines") {
      rows = [["Order no", "Date", "Customer", "Item", "Details", "Qty", "Unit", "Price", "Amount (before VAT)"]];
      r.os.forEach((o) => o.lines.forEach((l) => rows.push([o.no, o.date, o.customer.name, l.name, l.spec, l.qty, l.unit, Number(l.price).toFixed(2), h(lineHal(l.qty, l.price))])));
    } else {
      rows = [["Receipt no", "Date", "Customer", "Order no", "Method", "Note", "Amount"]];
      r.recv.forEach(({ o, p }) => rows.push([p.no || "", p.date, o.customer.name, o.no, p.method, p.note || "", h(hal(p.amount))]));
    }
    return "﻿" + rows.map((row) => row.map((v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\r\n");

  async function exportCsv(kind) {

    saveBlob(new Blob([text], { type: "text/csv;charset=utf-8" }), name);
    toast(`Saved ${name}`);
  }

        <div class="btn-row">${sy.url ? `<button class="btn primary" data-act="sync-now">Sync now</button><button class="btn" data-act="sync-test">Test</button><button class="btn danger" data-act="sync-off">Turn off</button>` : `<button class="btn primary" data-act="sync-connect">Connect</button>`}</div>

        <div class="btn-row">${NATIVE && Plug.Share && Plug.Filesystem ? `<button class="btn primary" data-act="share-backup">Share backup file</button>` : `<button class="btn primary" data-act="download-backup">Save backup file</button>`}<button class="btn" data-act="restore-file">Restore from file</button></div>

      </section>`;
  };
  function readStatuses() { $$("[data-st]").forEach((el) => { stEdit[Number(el.dataset.st)].name = el.value; }); }

  /* ---------- backup & restore ---------- */
  const backupName = () => `job-orders-backup-${fmtDate(today())}.json`;
  function backupJson() { return JSON.stringify({ app: "job-orders", exportedAt: nowIso(), ...state }); }
  function restoreFrom(text) {
    let s;
    try { s = JSON.parse(text); if (!Array.isArray(s.orders) || !Array.isArray(s.customers) || !Array.isArray(s.items)) throw 0; }
    catch (err) { return toast("That is not a Job Orders backup."); }
    const n = live(s.orders).length;
    confirmBox("Restore backup", `Replace everything on this device with the backup (${n} orders and quotations, ${live(s.customers).length} customers, ${live(s.items).length} items)?${device.sync.url ? " The restored records will also be sent to the shared Drive folder." : ""}`, "Restore", () => {
      delete s.app; delete s.exportedAt;
      state = migrate({ ...blank(), ...s, v: s.v || 1 });
      if (s.seq && !device.next) device.next = s.seq + 1;
      delete state.seq;
      if (device.sync.url) markAllDirty();
      stEdit = null; save(); render(); toast("Backup restored");
    });
  }
  /** Sample records: flagged ones, plus the fixed sample names from earlier versions. */
  const SAMPLE_CUST = { "Ahmed Al-Harbi": "0550000001", "Sara Al-Ghamdi": "0550000002", "Omar Saleh": "0550000003" };
  const isSampleCust = (c) => !!c && (c.sample || SAMPLE_CUST[c.name] === c.phone);
  function removeSamples() {
    const before = { o: live(state.orders).length, c: live(state.customers).length, i: live(state.items).length };
    const sampleCustIds = new Set(state.customers.filter(isSampleCust).map((c) => c.id));
    state.orders = state.orders.filter((o) => !(o.sample || (sampleCustIds.has(o.customerId) && isSampleCust({ name: o.customer.name, phone: o.customer.phone }))));
    const keptCust = new Set(state.orders.map((o) => o.customerId));
    state.customers = state.customers.filter((c) => !(sampleCustIds.has(c.id) && !keptCust.has(c.id)));
    state.items = state.items.filter((it) => !it.sample);
    // older sample items had no flag: drop them only if their name, price and details are unchanged
    const SAMPLE_ITEM_SIG = { "Business cards": 0.15, "Flyers A5": 0.35, "Roll-up banner": 180, "Letterhead A4": 0.6, "Stickers round": 0.25, "Flex banner": 35 };
    state.items = state.items.filter((it) => !(SAMPLE_ITEM_SIG[it.name] === it.price && /^(85×55 mm|148×210 mm|85×200 cm|A4, 100 gsm|Ø 60 mm|Flex 440 g)/.test(it.spec || "")));
    const st = state.settings;
    if (/\(Sample\)$/.test(st.companyName || "")) {
      // sample company details must never overwrite the real shared settings
      state.settings = { ...st, companyName: "", phone: st.phone === "+966 12 000 0000" ? "" : st.phone, dueDays: "", updatedAt: "1970-01-01T00:00:00.000Z" };
    }
    state.demo = false;
    const after = { o: live(state.orders).length, c: live(state.customers).length, i: live(state.items).length };
    return { removed: before.o - after.o + before.c - after.c + before.i - after.i, kept: after };
  }
  function markAllDirty() {
    TYPES.forEach((t) => state[t].forEach((r) => dirty.add(`${t}:${r.id}`)));
    dirty.add("settings:shared");
  }

  /* ---------- sync with the shared Drive folder ---------- */
  function scheduleSync() {
    if (!device.sync.url) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncNow(false), 3000);
  }
  async function callSync(body) {
    const res = await fetch(device.sync.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ pin: device.sync.pin, ...body }) });
    if (!res.ok) throw new Error(`The sync link answered with error ${res.status}.`);
    let j;
    try { j = await res.json(); } catch (e) { throw new Error("The sync link did not answer like a Job Orders sync script. Check the link."); }
    if (!j.ok) throw new Error(j.error || "Sync failed.");
    return j;
  }
  function applyRecord(t, r) {
    if (t === "settings") {
      const shared = {};
      SHARED.forEach((k) => { if (r[k] !== undefined) shared[k] = r[k]; });
      state.settings = { ...state.settings, ...shared, updatedAt: r.updatedAt };
      stEdit = null;
      return;
    }
    if (!TYPES.includes(t)) return;
    const arr = state[t], i = arr.findIndex((x) => x.id === r.id);
    const clean = { ...r }; delete clean._rev;
    if (i >= 0) arr[i] = clean; else arr.push(clean);
  }
  async function syncNow(manual) {
    const sy = device.sync;
    if (!sy.url || syncing) return;
    if (!navigator.onLine) { sy.error = "No internet connection. Will sync when back online."; banner(); if (manual) toast(sy.error); return; }
    syncing = true; retouched.clear(); banner();
    const sent = [...dirty];
    const changes = sent.map((k) => {
      const [t, id] = k.split(":");
      if (t === "settings") { const r = { id: "shared", updatedAt: state.settings.updatedAt }; SHARED.forEach((f) => (r[f] = state.settings[f])); return { t, r }; }
      const r = (state[t] || []).find((x) => x.id === id);
      return r ? { t, r } : null;
    }).filter(Boolean);
    try {
      const j = await callSync({ action: "sync", since: sy.since || 0, device: device.id, changes });
      sent.forEach((k) => { if (!retouched.has(k)) dirty.delete(k); });
      let got = 0;
      (j.records || []).forEach(({ t, r }) => {
        const k = `${t}:${t === "settings" ? "shared" : r.id}`;
        if (dirty.has(k)) return; // changed again here meanwhile; ours goes up next time
        applyRecord(t, r); got++;
      });
      sy.since = j.rev; sy.lastAt = nowIso(); sy.error = "";
      sy.lastMsg = `${changes.length} sent, ${got} received.`;
      persist();
      if (manual) toast(`Synced. ${sy.lastMsg}`);
      refreshAfterSync(got);
    } catch (e) {
      sy.error = e && e.message && !/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? e.message : "Could not reach the sync link. Check the internet and the link.";
      persist();
      if (manual) toast(sy.error);
    } finally {
      syncing = false; banner();
      if (dirty.size && !sy.error) scheduleSync();
    }
  }
  function refreshAfterSync(got) {
    const f = document.activeElement;
    const typing = f && $("#view").contains(f) && /INPUT|TEXTAREA|SELECT/.test(f.tagName);
    if ((got || tab === "settings") && !typing) render(); // never interrupt someone typing
    if (dlgCtx && dlg.open) {
      if (dlgCtx.kind === "order") openOrder(byId(state.orders, dlgCtx.id));
      if (dlgCtx.kind === "customer") openCustomer(byId(state.customers, dlgCtx.id));
      if (dlgCtx.kind === "receipt") openReceipt(...findPay(dlgCtx.id, dlgCtx.pid));
    }
  }
  window.addEventListener("online", () => syncNow(false));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(false); });
  setInterval(() => { if (!document.hidden) syncNow(false); }, 60000);

  /* ---------- events ---------- */
  function startDraft(preset) { draft = newDraft(preset); keepDraft(); closeDlg(); go("new"); }
  document.addEventListener("click", async (e) => {
    const wa = NATIVE && e.target.closest("#wa-link");
    if (wa) { e.preventDefault(); window.location.href = wa.href; return; } // Android opens the WhatsApp app
    const tb = e.target.closest("[data-tab]");
    if (tb) { if (tb.dataset.tab === "new" && tab === "new") return; closeDlg(); return go(tb.dataset.tab); }
    const sf = e.target.closest("[data-status-filter]");
    if (sf) { if (filters.view === "quotes") filters.qstatus = sf.dataset.statusFilter; else filters.status = sf.dataset.statusFilter; return render(); }
    const dt = e.target.closest("#d-disc-type button");
    if (dt) { readDraft(); draft.discType = dt.dataset.dt; $$("#d-disc-type button").forEach((x) => x.classList.toggle("on", x === dt)); keepDraft(); return refreshTotals(); }
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const id = b.dataset.id;
    switch (b.dataset.act) {
      case "confirm-yes": { const f = confirmYes; confirmYes = null; closeDlg(); return f && f(); }
      /* home & navigation */
      case "go-orders": filters.view = "orders"; filters.status = b.dataset.f || "Open"; return go("orders");
      case "go-quotes": filters.view = "quotes"; filters.qstatus = "Quote"; return go("orders");
      case "go-receipts": filters.rperiod = b.dataset.p || "month"; return go("receipts");
      case "go-settings-sec": go("settings"); { const el = $("#" + b.dataset.sec); if (el) el.scrollIntoView({ block: "start" }); } return;
      case "quick-new": return startDraft({});
      case "quick-quote": return startDraft({ kind: "quote" });
      case "quick-pay": return payPicker();
      case "orders-view": filters.view = b.dataset.v; return render();
      case "rep-period": filters.rep = b.dataset.p; return render();
      case "csv": try { await exportCsv(b.dataset.k); } catch (err) { if (!/cancel|abort/i.test(String(err && (err.message || err)))) toast("Could not export the file."); } return;
      /* editor */
      case "draft-kind": readDraft(); draft.kind = b.dataset.k; keepDraft(); return render();
      case "add-item": {
        readDraft();
        const it = byId(state.items, $("#d-additem").value);
        if (!it) return toast("Choose an item from the list first.");
        draft.lines.push({ name: it.name, spec: it.spec, unit: it.unit, qty: "", price: it.price, note: "" });
        keepDraft(); render();
        const last = $$(".line").pop(); if (last) $('[data-k="qty"]', last).focus();
        return;
      }
      case "add-custom": readDraft(); draft.lines.push({ name: "", spec: "", unit: "pcs", qty: "", price: "", note: "" }); keepDraft(); render(); { const last = $$(".line").pop(); if (last) $('[data-k="name"]', last).focus(); } return;
      case "rm-line": readDraft(); draft.lines.splice(Number(b.dataset.i), 1); keepDraft(); return render();
      case "clear-draft": draft = newDraft({ kind: draft.id ? "order" : draft.kind }); keepDraft(); return render();
      case "save-order": { const o = saveDraft(); if (o) { toast(`${o.no} saved`); filters.view = isQuote(o) ? "quotes" : "orders"; if (isQuote(o)) filters.qstatus = "Quote"; go("orders"); openOrder(o); } return; }
      case "save-share": { const o = saveDraft(); if (o) { filters.view = isQuote(o) ? "quotes" : "orders"; go("orders"); shareDlg(o, true); } return; }
      /* orders */
      case "open-order": return openOrder(byId(state.orders, id));
      case "share-order": return shareDlg(byId(state.orders, id), true);
      case "next-status": { const o = byId(state.orders, id), nx = nextStatus(o); if (nx) { setStatus(o, nx); openOrder(o); } return; }
      case "ready-msg": {
        const o = byId(state.orders, id);
        const st = state.settings.statuses;
        if (st.includes("Ready") && st.indexOf(o.status) < st.indexOf("Ready") && !isClosed(o) && o.status !== "On hold") setStatus(o, "Ready");
        return shareText(`Ready · ${o.no}`, readyMessage(o), o.customer.phone, `data-act="open-order" data-id="${o.id}"`);
      }
      case "order-reminder": { const o = byId(state.orders, id); return shareText(`Reminder · ${o.no}`, orderReminder(o), o.customer.phone, `data-act="open-order" data-id="${o.id}"`); }
      case "cust-reminder": { const c = byId(state.customers, id); return shareText(`Reminder · ${c.name}`, customerReminder(c), c.phone, `data-act="open-customer" data-id="${c.id}"`); }
      case "call": return openExternal(`tel:${String(b.dataset.phone).replace(/[^\d+]/g, "")}`);
      case "wa-chat": return openExternal(`https://wa.me/${waPhone(b.dataset.phone)}`);
      case "mark-delivered": { const o = byId(state.orders, id); setStatus(o, "Delivered"); b.remove(); return; }
      case "quote-convert": {
        const qo = byId(state.orders, id);
        return confirmBox("Convert to job order", `Create a job order from <b>${esc(qo.no)}</b> for ${esc(qo.customer.name)} (${sar(totals(qo).total)})?`, "Create job order", () => {
          const o = convertQuote(qo); filters.view = "orders"; filters.status = "Open"; go("orders"); openOrder(o); toast(`${o.no} created from ${qo.no}`);
        });
      }
      case "quote-decline": { const o = byId(state.orders, id); o.status = "Declined"; touch("orders", o); save(); render(); openOrder(o); return toast(`${o.no} marked Declined`); }
      case "quote-reopen": { const o = byId(state.orders, id); o.status = "Quote"; touch("orders", o); save(); render(); openOrder(o); return toast(`${o.no} reopened`); }
      case "open-receipt": return openReceipt(...findPay(id, b.dataset.pid));
      case "share-receipt": { const [o, p] = findPay(id, b.dataset.pid); return shareText(`Send receipt ${p.no || ""}`.trim(), receiptMessage(o, p), o.customer.phone, `data-act="open-receipt" data-id="${o.id}" data-pid="${p.id}"`); }
      case "r-period": filters.rperiod = b.dataset.p; return render();
      case "pdf-order": return pdfDlg("order", byId(state.orders, id));
      case "pdf-dn": return pdfDlg("dn", byId(state.orders, id));
      case "pdf-statement": return pdfDlg("statement", byId(state.customers, id));
      case "pdf-receipt": { const [o, p] = findPay(id, b.dataset.pid); return pdfDlg("receipt", o, p); }
      case "pdf-share": if (!lastPdf) return; try { await sharePdf(lastPdf); } catch (err) { if (!/cancel|abort/i.test(String(err && (err.message || err)))) toast("Could not share the PDF."); } return;
      case "pdf-save": if (lastPdf) { saveBlob(lastPdf.blob, lastPdf.name); toast(`Saved ${lastPdf.name}`); } return;
      case "logo-pick": { const f = $("#logo-file"); f.value = ""; return f.click(); }
      case "logo-remove": state.settings.logo = ""; touch("settings", state.settings); save(); render(); return toast("Logo removed");
      case "copy-msg": return toast((await copy($("#msg").value)) ? "Copied. Paste it in WhatsApp." : "Select the text and copy it manually.");
      case "share-other":
        try { await Plug.Share.share({ text: $("#msg").value, dialogTitle: "Send with…" }); } catch (err) { /* closed */ }
        return;
      case "add-payment": return paymentDlg(byId(state.orders, id), false);
      case "mark-paid": return paymentDlg(byId(state.orders, id), true);
      case "save-payment": {
        const o = byId(state.orders, id);
        const amt = hal($("#p-amount").value), bal = totals(o).bal;
        if (amt <= 0) { $("#p-amount").classList.add("invalid"); return toast("Enter an amount above zero."); }
        if (amt > bal) { $("#p-amount").classList.add("invalid"); return toast(`That is more than the balance of ${sar(bal)}.`); }
        const method = ($("#p-method .on") || {}).dataset?.m || "Cash";
        const pay = { id: uid(), no: nextReceipt(), date: $("#p-date").value || today(), amount: amt / 100, method, note: $("#p-note").value.trim() };
        o.payments.push(pay);
        touch("orders", o); save(); if (tab !== "new") render();
        openReceipt(o, pay);
        return toast(totals(o).bal <= 0 ? `${o.no} fully paid · receipt ${pay.no}` : `Receipt ${pay.no} saved`);
      }
      case "del-payment": {
        const o = byId(state.orders, id), p = o.payments.find((x) => x.id === b.dataset.pid);
        return confirmBox("Delete payment", `Delete the ${esc(p.method)} payment of <b>${sar(hal(p.amount))}</b> on ${fmtDate(p.date)} from ${esc(o.no)}?`, "Delete payment", () => {
          o.payments = o.payments.filter((x) => x.id !== p.id); touch("orders", o); save(); if (tab !== "new") render(); openOrder(o); toast(`${p.no ? "Receipt " + p.no : "Payment"} deleted`);
        });
      }
      case "edit-order": {
        const o = byId(state.orders, id);
        const d = o.discount || {};
        draft = { id: o.id, kind: isQuote(o) ? "quote" : "order", customerId: o.customerId, lines: o.lines.map((l) => ({ ...l })), vat: o.vat, vatRate: o.vatRate, notes: o.notes, date: o.date, dueDate: o.dueDate, validUntil: o.validUntil || "", discType: d.type === "pct" ? "pct" : "amt", discVal: d.value || "" };
        if (!byId(state.customers, o.customerId)) draft.customerId = "";
        keepDraft(); closeDlg(); return go("new");
      }
      case "dup-order": {
        const o = byId(state.orders, id), d = o.discount || {};
        startDraft({ kind: isQuote(o) ? "quote" : "order", customerId: byId(state.customers, o.customerId) ? o.customerId : "", lines: o.lines.map((l) => ({ ...l })), vat: o.vat, vatRate: o.vatRate, notes: o.notes, discType: d.type === "pct" ? "pct" : "amt", discVal: d.value || "" });
        return toast(`Copied ${o.no} into a new ${isQuote(o) ? "quotation" : "order"}`);
      }
      case "del-order": { const o = byId(state.orders, id); return confirmBox(`Delete ${isQuote(o) ? "quotation" : "order"}`, `Delete <b>${esc(o.no)}</b> for ${esc(o.customer.name)}? This cannot be undone.`, "Delete", () => { o.deleted = true; touch("orders", o); save(); render(); toast(`${o.no} deleted`); }); }
      /* customers */
      case "new-customer": return customerForm(null, b.dataset.for === "draft");
      case "open-customer": return openCustomer(byId(state.customers, id));
      case "edit-customer": return customerForm(byId(state.customers, id));
      case "save-customer": {
        const name = $("#c-name").value.trim();
        if (!name) { $("#c-name").classList.add("invalid"); $("#c-name").focus(); return toast("Enter the customer name."); }
        const data = { name, phone: $("#c-phone").value.trim(), company: $("#c-company").value.trim(), notes: $("#c-notes").value.trim() };
        let c = id && byId(state.customers, id);
        if (c) Object.assign(c, data); else { c = { id: uid(), ...data }; state.customers.push(c); }
        touch("customers", c);
        if (b.dataset.for === "draft") { readDraft(); draft.customerId = c.id; keepDraft(); }
        save(); closeDlg(); render(); return toast(id ? "Customer updated" : "Customer saved");
      }
      case "order-for": return startDraft({ customerId: id });
      case "quote-for": return startDraft({ customerId: id, kind: "quote" });
      case "del-customer": { const c = byId(state.customers, id); return confirmBox("Delete customer", `Delete <b>${esc(c.name)}</b>? Their saved orders stay in the Orders list.`, "Delete customer", () => { c.deleted = true; touch("customers", c); if (draft.customerId === id) draft.customerId = ""; save(); render(); toast("Customer deleted"); }); }
      /* items */
      case "new-item": return itemForm(null);
      case "edit-item": return itemForm(byId(state.items, id));
      case "save-item": {
        const name = $("#i-name").value.trim(), price = $("#i-price").value;
        if (!name) { $("#i-name").classList.add("invalid"); $("#i-name").focus(); return toast("Enter the item name."); }
        if (price === "" || Number(price) < 0) { $("#i-price").classList.add("invalid"); $("#i-price").focus(); return toast("Enter a price of 0 or more."); }
        const data = { name, spec: $("#i-spec").value.trim(), unit: $("#i-unit").value, price: hal(price) / 100 };
        let it = id && byId(state.items, id);
        if (it) Object.assign(it, data); else { it = { id: uid(), ...data }; state.items.push(it); }
        touch("items", it);
        save(); closeDlg(); render(); return toast(id ? "Item updated" : "Item saved");
      }
      case "del-item": { const it = byId(state.items, id); return confirmBox("Delete item", `Delete <b>${esc(it.name)}</b>? Orders that already use it are not changed.`, "Delete item", () => { it.deleted = true; touch("items", it); save(); render(); toast("Item deleted"); }); }
      /* settings */
      case "save-settings": {
        const rate = Number($("#s-rate").value), dueRaw = $("#s-due").value.trim();
        if (!(rate >= 0 && rate <= 100)) { $("#s-rate").classList.add("invalid"); return toast("VAT rate must be between 0 and 100."); }
        Object.assign(state.settings, { companyName: $("#s-company").value.trim(), phone: $("#s-phone").value.trim(), address: $("#s-address").value.trim(), email: $("#s-email").value.trim(), bankName: $("#s-bank").value.trim(), iban: $("#s-iban").value.trim().toUpperCase(), footer: $("#s-footer").value.trim(), vatDefault: $("#s-vat").checked, vatRate: rate, dueDays: dueRaw === "" ? "" : Math.max(0, parseInt(dueRaw, 10) || 0) });
        touch("settings", state.settings);
        if (!draft.lines.length && !draft.id) { draft = newDraft({ customerId: draft.customerId, kind: draft.kind }); keepDraft(); }
        save(); render(); return toast("Company settings saved");
      }
      case "st-add": readStatuses(); stEdit.splice(stEdit.length - 2, 0, { old: "", name: "" }); render(); { const el = $$("[data-st]")[stEdit.length - 3]; if (el) el.focus(); } return;
      case "st-up": case "st-down": { readStatuses(); const i = Number(b.dataset.i), j = b.dataset.act === "st-up" ? i - 1 : i + 1; [stEdit[i], stEdit[j]] = [stEdit[j], stEdit[i]]; return render(); }
      case "st-del": readStatuses(); stEdit.splice(Number(b.dataset.i), 1); return render();
      case "st-save": {
        readStatuses();
        const names = stEdit.map((x) => x.name.trim());
        if (names.some((n) => !n)) return toast("A status name is empty. Type a name or delete it.");
        if (new Set(names.map((n) => n.toLowerCase())).size !== names.length) return toast("Two statuses have the same name.");
        stEdit.forEach((x, i) => {
          if (x.old && x.old !== names[i]) state.orders.forEach((o) => { if (!isQuote(o) && o.status === x.old) { o.status = names[i]; touch("orders", o); } });
        });
        state.settings.statuses = names; touch("settings", state.settings);
        stEdit = null; save(); render(); return toast("Statuses saved");
      }
      case "theme": device.theme = b.dataset.themeSet; applyTheme(); persist(); return render();
      case "save-device": {
        const up = (sel) => $(sel).value.trim().toUpperCase().replace(/-+$/, "");
        const series = up("#d-series"), next = parseInt($("#d-next").value, 10);
        let rseries = up("#d-rseries"), qseries = up("#d-qseries");
        const rnext = parseInt($("#d-rnext").value, 10), qnext = parseInt($("#d-qnext").value, 10);
        if (rseries === seriesFor(device.series, "RCT")) rseries = seriesFor(series, "RCT"); // follow the order series unless customised
        if (qseries === seriesFor(device.series, "QT")) qseries = seriesFor(series, "QT");
        for (const [v, sel, label] of [[series, "#d-series", "Order series"], [rseries, "#d-rseries", "Receipt series"], [qseries, "#d-qseries", "Quotation series"]]) {
          if (!/^[A-Z0-9][A-Z0-9-]{0,11}$/.test(v)) { $(sel).classList.add("invalid"); return toast(`${label} can use letters, numbers and dashes, for example JO-A.`); }
        }
        for (const [v, sel] of [[next, "#d-next"], [rnext, "#d-rnext"], [qnext, "#d-qnext"]]) if (!(v >= 1)) { $(sel).classList.add("invalid"); return toast("Next numbers must be 1 or more."); }
        // a new series starts again at 1 unless the number was changed by hand (existing numbers are still skipped)
        device.next = series !== device.series && next === device.next ? 1 : next;
        device.rnext = rseries !== device.rseries && rnext === device.rnext ? 1 : rnext;
        device.qnext = qseries !== device.qseries && qnext === device.qnext ? 1 : qnext;
        device.series = series; device.rseries = rseries; device.qseries = qseries; persist(); render();
        return toast(`Next: ${nextNumber(true)} · ${nextReceipt(true)} · ${nextQuote(true)}`);
      }
      case "sync-connect": case "sync-test": {
        const url = (b.dataset.act === "sync-connect" ? $("#y-url").value : device.sync.url).trim(), pin = (b.dataset.act === "sync-connect" ? $("#y-pin").value : device.sync.pin).trim();
        if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { $("#y-url").classList.add("invalid"); return toast("Paste the sync link that starts with https://script.google.com/"); }
        if (!pin) { $("#y-pin").classList.add("invalid"); return toast("Enter the team PIN."); }
        const prev = { ...device.sync };
        device.sync.url = url; device.sync.pin = pin;
        b.disabled = true; b.textContent = "Checking…";
        try {
          await callSync({ action: "ping" });
          if (b.dataset.act === "sync-test") { toast("Connection works."); device.sync = prev; device.sync.error = ""; persist(); return render(); }
          device.sync = { url, pin, since: 0, lastAt: "", lastMsg: "", error: "" };
          if (state.demo) removeSamples();
          markAllDirty(); // upload everything this device has; sample records were removed above
          if (state.settings.updatedAt.startsWith("1970")) dirty.delete("settings:shared");
          persist(); render(); toast("Connected. Syncing now…");
          if (device.series === "JO") toast("Connected. Set a different order series for this device, e.g. JO-B.");
          await syncNow(true);
        } catch (err) {
          device.sync = prev; persist(); render();
          toast(err && err.message && !/Failed to fetch|NetworkError|Load failed/i.test(err.message) ? err.message : "Could not reach the sync link. Check the internet and the link.");
        }
        return;
      }
      case "sync-now": return syncNow(true);
      case "sync-off": return confirmBox("Turn off sync", "Stop syncing this device? Its data stays here, and the shared Drive folder is not changed.", "Turn off", () => { device.sync = { url: "", pin: "", since: 0, lastAt: "", lastMsg: "", error: "" }; persist(); render(); toast("Sync turned off on this device"); });
      case "copy-backup": {
        const txt = backupJson();
        if (NATIVE && Plug.Clipboard) { try { await Plug.Clipboard.write({ string: txt }); return toast("Backup copied. Paste it somewhere safe."); } catch (err) { /* fall back below */ } }
        try { await navigator.clipboard.writeText(txt); return toast("Backup copied. Paste it somewhere safe."); }
        catch (err) { const ta = $("#s-restore"); ta.value = txt; ta.focus(); ta.select(); return toast("Backup text is in the box below. Copy it from there."); }
      }
      case "share-backup": {
        try {
          const w = await Plug.Filesystem.writeFile({ path: backupName(), data: backupJson(), directory: "CACHE", encoding: "utf8" });
          await Plug.Share.share({ title: backupName(), files: [w.uri], dialogTitle: "Save backup to…" });
        } catch (err) { if (err && !/cancel/i.test(String(err.message || err))) toast("Could not share the backup file."); }
        return;
      }
      case "download-backup": saveBlob(new Blob([backupJson()], { type: "application/json" }), backupName()); return toast(`Saved ${backupName()} to Downloads`);
      case "restore-file": { const f = $("#restore-file"); f.value = ""; return f.click(); }
      case "restore": return restoreFrom($("#s-restore").value);
      case "clear-sample": return confirmBox("Clear sample data", "Remove the sample customers, items and orders? Anything you added yourself is kept.", "Clear samples", () => { const r = removeSamples(); if (state.settings.updatedAt.startsWith("1970")) state.settings.updatedAt = nowIso(); if (!jobs().length) device.next = 1; if (!quotes().length) device.qnext = 1; draft = newDraft(); keepDraft(); stEdit = null; save(); render(); toast(`Samples removed. Kept ${r.kept.o} orders, ${r.kept.c} customers, ${r.kept.i} items.`); });
      case "load-sample": return confirmBox("Load sample data", "Replace everything on this device with sample data? Share a backup first if you want to keep your records.", "Load samples", () => { state = sample(); dirty.clear(); draft = newDraft(); keepDraft(); stEdit = null; persist(); render(); toast("Sample data loaded"); });
      case "wipe": return confirmBox("Delete everything", `Delete all orders, customers, items and settings on this device? This cannot be undone.${device.sync.url ? " The shared Drive folder is not changed." : ""}`, "Delete everything", () => { state = blank(); state.demo = false; dirty.clear(); device.sync.since = 0; draft = newDraft(); keepDraft(); stEdit = null; persist(); render(); toast("All data deleted on this device"); });
    }
  });
  document.addEventListener("input", (e) => {
    const map = { "o-search": "q", "c-search": "cq", "i-search": "iq", "r-search": "rq" };
    const k = map[e.target.id];
    if (k) { filters[k] = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#" + e.target.id); el.focus(); el.setSelectionRange(pos, pos); }
    else if (e.target.classList.contains("invalid")) e.target.classList.remove("invalid");
  });
  $("#logo-file").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const url = await loadLogo(f);
      if (url.length > 250000) return toast("That logo is too detailed. Use a simpler or smaller image.");
      state.settings.logo = url; touch("settings", state.settings); save(); render(); toast("Logo saved");
    } catch (err) { toast(err.message); }
  });
  $("#restore-file").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => restoreFrom(String(r.result));
    r.onerror = () => toast("Could not read that file.");
    r.readAsText(f);
  });

  if (NATIVE && Plug.App) {
    Plug.App.addListener("backButton", () => {
      if (dlg.open) closeDlg();
      else if (NAV_OF[tab]) go("more");
      else if (tab !== "home") go("home");
      else Plug.App.exitApp();
    });
  }

  go(PAGES.includes(tab) ? tab : "home");
  if (device.sync.url) syncNow(false);
})();
</script>
</body>
</html>
