name: Android APK

# Builds the "Job Orders" Android app from job-order-app/index.html and publishes the
# APK on the release page, so it can be downloaded straight to a phone.
on:
  push:
    branches: [claude/printing-ops-website-aw6cpu]
    paths:
      - "job-order-app/**"
      - "job-order-android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-order-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm ci --no-audit --no-fund

      - name: Create Android project
        run: |
          npm run copy-web
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Set version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build signed APK
        working-directory: job-order-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/job-order-android/signing/job-orders.keystore" \
            -Pandroid.injected.signing.store.password=joborders-sideload \
            -Pandroid.injected.signing.key.alias=joborders \
            -Pandroid.injected.signing.key.password=joborders-sideload
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/job-orders.apk"
          ls -la "$GITHUB_WORKSPACE/job-orders.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: job-orders-apk
          path: job-orders.apk

      - name: Publish on the release page
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=job-orders-latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Job Orders for Android" \
              --notes "Download job-orders.apk on your Android phone and tap Install. Updates install over the old version and keep your data."
          fi
          gh release upload "$TAG" job-orders.apk --clobber
          gh release edit "$TAG" --notes "Latest build 1.0.${{ github.run_number }} from ${GITHUB_SHA::7}. Download job-orders.apk on your Android phone and tap Install. Updates install over the old version and keep your data."
