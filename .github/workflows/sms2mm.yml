name: sms2mm

# Bank SMS → Money Manager app. Only runs when files under sms2mm/ change.
on:
  push:
    paths: ["sms2mm/**", ".github/workflows/sms2mm.yml"]
  pull_request:
    paths: ["sms2mm/**", ".github/workflows/sms2mm.yml"]
  workflow_dispatch:

jobs:
  build:
    name: Core tests + APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the APK to the sms2mm-latest pre-release
    defaults:
      run:
        working-directory: sms2mm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (parser, OTP filter, keyword rules)
        run: ./gradlew -p core test --console=plain

      # Optional stable signing key (repository secrets SMS2MM_KEYSTORE_B64 + SMS2MM_KEYSTORE_PASSWORD).
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SMS2MM_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SMS2MM_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \n\r\t' | base64 -d > "$RUNNER_TEMP/sms2mm.jks"
            # Copy-paste on a phone can add spaces or line breaks; the password has none.
            PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \n\r\t')
            # Safe checks only (no secret values): which secret is wrong if signing fails.
            echo "keystore sha256 prefix: $(sha256sum "$RUNNER_TEMP/sms2mm.jks" | cut -c1-16)"
            echo "password length: ${#PW}"
            if keytool -list -keystore "$RUNNER_TEMP/sms2mm.jks" -storepass "$PW" > /dev/null 2>&1; then
              echo "SMS2MM_KEYSTORE=$RUNNER_TEMP/sms2mm.jks" >> "$GITHUB_ENV"
              echo "SMS2MM_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
              echo "Signing with the stable key"
            else
              echo "::error::The signing password does not open the keystore: re-paste SMS2MM_KEYSTORE_PASSWORD (and SMS2MM_KEYSTORE_B64)"
              exit 1
            fi
          else
            echo "::warning::No signing secrets set: using a temporary debug key (updates need an uninstall first)"
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: "Security check: no INTERNET permission in the merged manifest"
        run: |
          manifests=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged*' -path '*debug*')
          test -n "$manifests" || { echo "merged manifest not found"; exit 1; }
          echo "$manifests"
          grep -lE '<uses-permission[^>]*android.permission.RECEIVE_SMS' $manifests > /dev/null || { echo "RECEIVE_SMS missing – wrong file?"; exit 1; }
          if grep -nE '<uses-permission[^>]*android.permission.INTERNET' $manifests; then
            echo "::error::INTERNET permission found in the merged manifest"; exit 1
          fi
          echo "OK: no INTERNET permission"

      - name: Show which key signed the APK
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: sms2mm-debug-apk
          path: sms2mm/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Direct phone download, no GitHub login or zip:
      # https://github.com/<owner>/<repo>/releases/tag/sms2mm-latest
      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/sms2mm.apk

      - name: Publish to the sms2mm-latest pre-release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sms2mm-latest
          name: SMS → Money Manager (latest build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: sms2mm/app/build/outputs/apk/debug/sms2mm.apk
          body: |
            Latest build of the SMS → Money Manager app from commit ${{ github.sha }}.
            Download **sms2mm.apk** on your phone and open it. Install steps: sms2mm/README.md.
